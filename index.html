  { "id":"pLinK59", "title":"维修电路", "thinking":"本题是经典的0-1BFS（双端队列BFS）最短路问题，将网格格点作为节点、每个元件的两种对角线方向决定相邻节点间的边权是0还是1，用双端队列求出从左上到右下的最小旋转次数。", "code":"// 0-1BFS: 若当前元件方向匹配对角线则边权0，否则需旋转边权1\nint cost = (g[gx][gy] == wire[d]) ? 0 : 1;\nif (dist[x][y] + cost < dist[nx][ny]) {\n    dist[nx][ny] = dist[x][y] + cost;\n    (cost == 0) ? dq.push_front({nx, ny}) : dq.push_back({nx, ny});\n}", "summary":"学会将电路板格点抽象为(R+1)x(C+1)的图节点、元件方向映射为0/1边权，用双端队列BFS（0-1BFS）O(R*C)求解最小旋转次数，是典型的0-1权重图最短路建模。注意起点为(0,0)终点为(R,C)，以及ix/iy数组将方向映射到元件坐标的技巧。", "fullCode":"#include <iostream>\n#include <deque>\n#include <cstring>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Node\n{\n    int x, y;\n};\n\nconst int dx[4] = {-1, -1, 1, 1};\nconst int dy[4] = {-1, 1, -1, 1};\nconst int ix[4] = {-1, -1, 0, 0};\nconst int iy[4] = {-1, 0, -1, 0};\n// actual wire directions for '/' and '\\'\n// '/' connects (0,1) and (1,0), i.e., top-right and bottom-left\n// '\\' connects (0,0) and (1,1), i.e., top-left and bottom-right\nconst char wire[4] = {'\\\\', '/', '/', '\\\\'};\n\nint main()\n{\n    int T;\n    cin >> T;\n    while (T--)\n    {\n        int R, C;\n        cin >> R >> C;\n        vector<string> g(R);\n        for (int i = 0; i < R; i++)\n            cin >> g[i];\n\n        // 0-1 BFS: distance to each node (R+1)x(C+1)\n        vector<vector<int>> dist(R + 1, vector<int>(C + 1, 1e9));\n        deque<Node> dq;\n        dq.push_back({0, 0});\n        dist[0][0] = 0;\n\n        while (!dq.empty())\n        {\n            auto cur = dq.front();\n            dq.pop_front();\n            int x = cur.x, y = cur.y;\n\n            for (int d = 0; d < 4; d++)\n            {\n                int nx = x + dx[d], ny = y + dy[d];\n                if (nx < 0 || nx > R || ny < 0 || ny > C)\n                    continue;\n                int gx = x + ix[d], gy = y + iy[d];\n                // If current wire matches this diagonal, cost 0, else 1\n                int cost = (g[gx][gy] == wire[d]) ? 0 : 1;\n                if (dist[x][y] + cost < dist[nx][ny])\n                {\n                    dist[nx][ny] = dist[x][y] + cost;\n                    if (cost == 0)\n                        dq.push_front({nx, ny});\n                    else\n                        dq.push_back({nx, ny});\n                }\n            }\n        }\n        if (dist[R][C] == 1e9)\n            cout << \"NO SOLUTION\" << endl;\n        else\n            cout << dist[R][C] << endl;\n    }\n    return 0;\n}\n", "fullProblem":"# LinK59 维修电路\n\n- 内部 ID：7522\n- 难度：Mid\n- 类型：OI\n- 时间限制：1000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n\n---\n\n## 题目描述\n\n<p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/506795aaeb.png\" width=\"554\" height=\"311\" /><br /></span></p><p><span style=\"color: rgb(51, 51, 51);\">林克的大师摩托的飞行装置被撞坏了，极度影响他的卡丁车比赛。下图是飞行装置的</span>电路板示意图。</p><p>电路板的整体结构是一个R行C列的网格（R,C≤500）</p><p><span style=\"color: rgb(51, 51, 51);\"><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_be6ff7a219-%E7%94%B5%E8%B7%AF.png\" alt=\"电路.png\" /><br /></span></p><p>每个格点都是电线的接点，每个格子都包含一个电子元件。</p><p>电子元件的主要部分是一个<span style=\"color: rgb(227, 55, 55);\">可旋转</span>的、连接一条对角线上的两个接点的短电缆。</p><p>在旋转之后，它就可以连接另一条对角线的两个接点。</p><p>电路板左上角的接点接入直流电源，右下角的接点接入飞行车的发动装置。</p><p>林克发现因为某些元件的方向不小心发生了改变，电路板可能处于断路的状态。</p><p>请问如何旋转最少数量的元件，使电源与发动装置重新连同在一起呢？</p><p>注意：电流只能通过斜向的线段，水平和竖直线段不是电线。</p><p><br /></p><p>提示：<span style=\"color: rgb(51, 51, 51);\">只需要按照下面的方式旋转标准件，就可以使得电源和发动机之间连通。</span></p><p><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_a0e8e80a19-%E7%94%B5%E8%B7%AF2.png\" alt=\"电路2.png\" /><br /></p>\n\n## 输入格式\n\n<p>输入文件包含多组测试数据。</p><p>第一行包含一个整数T，表示测试数据的数目。</p><p>对于每组测试数据，第一行包含正整数R和C，表示电路板的行数和列数。</p><p>之后R行，每行C个字符，字符是<code>&quot;/&quot;</code>和<code>&quot;\\&quot;</code>中的一个，表示标准件的方向。</p><h4><b>数据范围</b></h4><p><img alt=\"image.png\" src=\"/public/upload/cc98c64485.png\" width=\"182\" height=\"65\" /></p>\n\n\n## 输出格式\n\n<p>对于每组测试数据，在单独的一行输出一个正整数，表示所需的最小旋转次数。</p><p>如果无论怎样都不能使得电源和发动机之间连通，输出NO SOLUTION。</p>\n\n\n## 样例\n\n### 样例输入\n\n```text\n1\n3 5\n\\\\/\\\\\n\\\\///\n/\\\\\\\\\n```\n\n### 样例输出\n\n```text\n1\n```\n\n## 提示\n\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1mC4y1W7Zr\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/177/\" target=\"_blank\">ACWing讲解</a></p><p>改编自《电路维修》</p>\n\n" },
  { "id":"pLinK60", "title":"突袭路线", "thinking":"本题为有向图拓扑排序模板题，使用Kahn算法（BFS）维护入度为0的顶点队列，依次弹出并更新邻接点入度，若最终队列输出顶点数不足n则说明存在环，输出-1。", "code":"// Kahn算法：入度为0的顶点入队，依次弹出并加入答案，邻接点入度减1\nfor(i=1;i<=n;++i) if(!d[i]) q[++tt]=i;\nwhile(hh<=tt){int t=q[hh++]; res[++cnt]=t;\n  for(i=head[t];i;i=nxt[i]) if(--d[to[i]]==0) q[++tt]=to[i];}\nreturn cnt==n?res:-1;", "summary":"拓扑排序必须用队列/栈维护入度为0的顶点依次处理，核心是要检测环——若最终输出顶点数少于n则该图存在环无拓扑序列。", "fullCode":"#include<iostream>\n#include<algorithm>\n#include<queue>\n#include<cstring>\nusing namespace std;\n#define For(a,begin,end) for (int a=(begin);a<(end);a++)\nconst int N=10000007;\nint n,m;\nint head[N],edge[N],nextVertex[N],idx;\nint q[N],d[N];\nvoid add(int a,int b)\n{\n    \n}", "fullProblem":"# LinK60 突袭路线\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/d3817e11ae.png\" width=\"554\" height=\"272\" /><br /></p><p>为了解救公主，林克必须深入敌后。<br />在备战前，他拿出“关系分析仪”扫描敌营中每个士兵之间的关系。</p><p>关系分析仪的功能说明如下：<br />如果A的活动范围在B的眼皮底下，那么分析仪就会从B出发连一条射线指向A（B--&gt;A).</p><p>经过扫描，林克得到全营敌兵的相互关系。有些敌人被多个同伴看顾，有些敌人背后一个替他守望的都没有。</p><p>林克决定从背后没有人的敌人开始，潜伏到其背后，突袭之，并且避免被其他人发现。</p><p>军营一共有n个敌人，彼此之间的关系有m条射线，请找到一条可以逐个击破敌人的路线图。</p><p>如果找不到这样一条突袭路线，请则输出-1.</p><p><br />提示：<br />问题转化为：给定一个n个点m条边的有向图，点的编号是1到n，图中可能存在重边和自环。</p><p>请输出任意一个该有向图的拓扑序列，如果拓扑序列不存在，则输出-1。</p><p>若一个由图中所有点构成的序列A满足：对于图中的每条边(x, y)，x在A中都出现在y之前，则称A是该图的一个拓扑序列。</p><p><span style=\"color: rgb(227, 55, 55);\">数据范围：1≤n,m≤10^5</span></p>\n\n## 输入描述\n\n<p>第一行包含两个整数n和m</p><p>接下来m行，每行包含两个整数x和y，表示存在一条从点x到点y的有向边(x, y)。</p>\n\n## 输出描述\n\n<p>共一行，如果存在拓扑序列，则输出拓扑序列。</p><p>否则输出-1。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 3\n1 2\n2 3\n1 3\n```\n\n#### 输出\n\n```text\n1 2 3\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/BV1x5411s7ev\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/video/280/\" target=\"_blank\">acwing讲解</a></p><p>改编自《<span style=\"color: rgb(73, 80, 96);\"><a href=\"https://www.acwing.com/problem/content/description/850/\" target=\"_blank\">有向图的拓扑序列</a>》</span></p>\n" },
  { "id":"pLinK61", "title":"最省赛程", "thinking":"以(城市, 当前油量)为状态的Dijkstra最短路，每次一单位加油或沿边行驶，首次到达终点即为最少油钱。", "code":"// Dijkstra求最小油费: 状态(city, fuel)\ndist[u][f+1] = c + price[u]; // 加一单位油\npq.push({u, f+1, c + price[u]});\nfor (auto &e : g[u])\n    if (f >= e.d) // 油量够则走边\n        dist[e.to][f-e.d] = c, pq.push({e.to, f-e.d, c});", "summary":"二维状态Dijkstra：把油箱油量作为状态维度，每次决策只有加一单位油或沿边走，状态空间有限就能求解带油价差异的最短路问题。", "fullCode":"#include <iostream>\n#include <vector>\n#include <queue>\n#include <cstring>\n#include <algorithm>\nusing namespace std;\n\nstruct State\n{\n    int city, fuel, cost;\n    bool operator>(const State &o) const { return cost > o.cost; }\n};\n\nstruct Edge\n{\n    int to, d;\n};\n\nint main()\n{\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int N, M;\n    cin >> N >> M;\n    vector<int> price(N);\n    for (int i = 0; i < N; i++)\n        cin >> price[i];\n    vector<vector<Edge>> g(N);\n    while (M--)\n    {\n        int u, v, d;\n        cin >> u >> v >> d;\n        g[u].push_back({v, d});\n        g[v].push_back({u, d});\n    }\n    int q;\n    cin >> q;\n    while (q--)\n    {\n        int C, S, E;\n        cin >> C >> S >> E;\n        // Dijkstra on (city, fuel) state\n        vector<vector<int>> dist(N, vector<int>(C + 1, 1e9));\n        priority_queue<State, vector<State>, greater<State>> pq;\n        dist[S][0] = 0;\n        pq.push({S, 0, 0});\n        int ans = -1;\n        while (!pq.empty())\n        {\n            auto [u, f, c] = pq.top();\n            pq.pop();\n            if (c != dist[u][f])\n                continue;\n            if (u == E)\n            {\n                ans = c;\n                break;\n            }\n            // Option 1: refuel 1 unit\n            if (f < C && c + price[u] < dist[u][f + 1])\n            {\n                dist[u][f + 1] = c + price[u];\n                pq.push({u, f + 1, c + price[u]});\n            }\n            // Option 2: go along edges\n            for (auto &e : g[u])\n            {\n                if (f >= e.d && c < dist[e.to][f - e.d])\n                {\n                    dist[e.to][f - e.d] = c;\n                    pq.push({e.to, f - e.d, c});\n                }\n            }\n        }\n        if (ans == -1)\n            cout << \"impossible\" << endl;\n        else\n            cout << ans << endl;\n    }\n    return 0;\n}\n", "fullProblem":"# LinK61 最省赛程\n\n- 内部 ID：7524\n- 难度：High\n- 类型：OI\n- 时间限制：5000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n\n---\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/4af77a00ff.png\" width=\"388\" height=\"216\" /><br /></p><p style=\"margin-left: 0px;\">为了让自己能够驾驭大师摩托，打开了大师摩托的隐藏任务：“赛车试炼”。</p><p style=\"margin-left: 0px;\">然而这个特殊的赛车试炼，竟然比的不是车速，比的是如何“省”油钱。</p><p style=\"margin-left: 0px;\">林克需要驾驶不同邮箱容量各异的赛车，从起点城市S开到终点城市E。</p><p style=\"margin-left: 0px;\">有N个城市（编号0、1…N-1）和M条赛道(构成一张无向图)。<br /></p><p>在每个城市里边都有一个加油站，不同的加油站的单位油价不一样(有些城市油价贵，有些城市油价便宜些)。</p><p>请计算，如果林克驾驶的是一辆油箱容量为C的赛车，那么他从起点城市S开到终点城市E至少要花多少油钱？<br /></p><p><span style=\"color: rgb(51, 51, 51);\">注意：</span><span style=\"color: rgb(51, 51, 51);\">车子初始时油箱是空的，需要在起点城市加油方可起行。</span><br /></p>\n\n## 输入格式\n\n<p>第一行包含两个整数N和M。</p><p>第二行包含N个整数，代表N个城市的单位油价，第i个数即为第i个城市的油价Pi。</p><p>接下来M行，每行包括三个整数u,v,d，表示城市u与城市v之间存在道路，且赛车从u到v需要消耗的油量为d。</p><p>接下来一行包含一个整数q，代表问题数量（q&lt;100)</p><p>接下来q行，每行包含三个整数C、S、E，分别表示<span style=\"color: rgb(51, 51, 51);\">赛车</span>油箱容量、起点城市S、终点城市E。</p><p><b>数据范围：</b></p><p><img alt=\"image.png\" src=\"/public/upload/e861511252.png\" width=\"150\" height=\"120.33203125\" /><br /></p>\n\n\n## 输出格式\n\n<p>对于每个问题，输出一个整数，表示所需的最少油钱。</p><p>如果无法从起点城市开到终点城市，则输出”impossible”。</p><p>每个结果占一行。</p>\n\n\n## 样例\n\n### 样例输入\n\n```text\n5 5\n10 10 20 12 13\n0 1 9\n0 2 8\n1 2 1\n1 3 11\n2 3 7\n2\n10 0 3\n20 1 4\n```\n\n### 样例输出\n\n```text\n170\nimpossible\n```\n\n## 提示\n\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1sf4y1m7V5\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/178/\" target=\"_blank\">ACWing讲解</a></p><p>改变自《装满的油箱》</p>\n\n" },
  { "id":"pLinK62", "title":"数字三角形", "thinking":"考察经典DP入门题，从三角形底部向上递推，每个位置加上下方两个可走位置的最大值，最终顶部即为最大路径和。", "code":"// 从倒数第二行开始向上递推，每个位置加上下方和右下方的较大值\nfor(int i=n-1;i;i--)\n    for(int j=1;j<=i;j++)\n        f[i][j]+=max(f[i+1][j],f[i+1][j+1]);\ncout<<f[1][1]<<endl;", "summary":"数字三角形是入门级DP，核心是自底向上的状态转移方程 f[i][j] += max(f[i+1][j], f[i+1][j+1])，覆盖原数组即可省去额外空间。", "fullCode":"#include<iostream>\n#include<cstring>\n#include<algorithm>\nusing namespace std;\nconst int N=510;\nint n;\nint f[N][N];\nint main()\n{\n    cin>>n;\n    for(int i=1;i<=n;i++)\n    {\n        for(int j=1;j<=i;j++)\n        {\n            cin>>f[i][j];\n        }\n    }\n    for(int i=n-1;i;i--)\n    {\n        for(int j=1;j<=i;j++)\n        {\n            f[i][j]+=max(f[i+1][j],f[i+1][j+1]);\n        }\n    }\n    cout<<f[1][1]<<endl;\n    return 0;\n}", "fullProblem":"# LinK62 数字三角形\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p>数字三角形是动态规划的入门题，小鲁如果要入门动态规划，这道题是不可不做的：</p><pre>7<br />3   8<br />8   1   0<br />2   7   4   4<br />4   5   2   6   5<br /><br />(图1)</pre><p><span style=\"color: rgb(35, 31, 23);\">图1给出了一个数字三角形。从三角形的顶部到底部有很多条不同的路径。对于每条路径，把路径上面的数加起来可以得到一个和，你的任务就是找到最大的和。</span></p><p><span style=\"color: rgb(35, 31, 23);\">注意：路径上的每一步只能从一个数走到正下方和右下方的位置。</span></p>\n\n## 输入描述\n\n<p><span style=\"color: rgb(35, 31, 23);\">输入的是一行是一个整数N (1 &lt; N &lt;= 1000)，给出三角形的行数。下面的N行给出数字三角形。数字三角形上的数的范围都在0和100之间。</span><br /></p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(35, 31, 23);\">输出最大的和。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n5\n7\n3 8\n8 1 0 \n2 7 4 4\n4 5 2 6 5\n```\n\n#### 输出\n\n```text\n30\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/av97264332\" target=\"_blank\">什么是动态规划</a></p><p><a href=\"https://www.bilibili.com/video/av97263444\" target=\"_blank\">Andy的讲解</a></p>\n" },
  { "id":"pLinK63", "title":"林克的01背包", "thinking":"经典01背包问题，考察二维DP状态转移，外层枚举物品、内层枚举容量，对每个物品决策取或不取即可。", "code":"// 二维DP：f[i][j] = 前i个物品容量j的最大价值\nfor(int i=1;i<=n;i++)\n    for(int j=0;j<=m;j++) {\n        f[i][j]=f[i-1][j];          // 不选第i个\n        if(j>=v[i]) f[i][j]=max(f[i][j],f[i-1][j-v[i]]+w[i]); // 选第i个\n    }\ncout<<f[n][m]<<endl;", "summary":"01背包的二维DP模板要牢记选与不选两种转移，注意容量从0开始枚举且选的情况要保证j>=v[i]。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=1007;\nint n,m;\nint v[N],w[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>v[i]>>w[i];\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n        {\n            f[i][j]=f[i-1][j];\n            if(j>=v[i])\n                f[i][j]=max(f[i][j],f[i-1][j-v[i]]+w[i]);\n        }\n    cout<<f[n][m]<<endl;\n    return 0;\n}", "fullProblem":"# LinK63 林克的01背包\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p>一眨眼一学期快结束了，早就自学完大四4年计算机专业的小华拿到了任天堂公司的offer提前毕业走上他喜爱的设计之路。</p><p>放心不下还在学校苦苦自学的小鲁，小华送给小鲁一套VR装置和一个新名字——林克。</p><p>他对小鲁说：从此以后，我写的VR编程环境来继续引导你自学编程，但是在这新的虚拟世界中，你要化身为林克，接受各种编程试炼的挑战，你愿意吗？</p><p>小鲁知道随着小华的离开，自己自主学习的新时代来了，他挥泪痛别小华，欣然接过小华的赠与，带上林克头套，进入编程大陆，开始了奇妙的VR编程之旅。</p><p>他还来不及为着小华的离开伤感，第一个挑战就来临了。<br /></p><p>“林克”面临一个艰难的选择,他的背包容量有限,而面前摆放着价值不同的物品(各种套装)</p><p>你可以帮帮他吗?</p><p><img alt=\"image.png\" src=\"/public/upload/4605ef2575.png\" width=\"357\" height=\"201\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/6f6acafda3.png\" width=\"612\" height=\"143\" /><br /></p>\n\n## 输入描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/a884a9d2d3.png\" width=\"651\" height=\"72\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/a1dc684fed.png\" width=\"192\" height=\"59\" /><br /></p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4 5\n1 2\n2 4\n3 4\n4 5\n```\n\n#### 输出\n\n```text\n8\n```\n\n### 样例 2\n\n#### 输入\n\n```text\n16 24\n30 34\n78 40\n96 97\n2 38\n59 57\n10 48\n28 65\n40 17\n95 84\n17 5\n80 83\n74 32\n37 28\n44 36\n25 14\n95 29\n```\n\n#### 输出\n\n```text\n86\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/BV197411y7mb\" target=\"_blank\">Andy的讲解</a><br /></p><p><a href=\"https://www.acwing.com/video/944/\" target=\"_blank\">acwing讲解(2020)</a><br /></p>\n" },
  { "id":"pLinK64", "title":"林克的完全背包", "thinking":"完全背包问题，物品无限件可用，朴素解法在01背包基础上加一层k循环枚举每件物品取多少个，转移方程f[i][j]=max(f[i][j-k*v[i]]+k*w[i])。", "code":"// 完全背包：k枚举第i种物品选取件数\nfor(int i=1;i<=n;i++)\n    for(int j=0;j<=m;j++)\n        for(int k=0;k*v[i]<=j;k++)\n            f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+k*w[i]);", "summary":"完全背包与01背包的区别在于每种物品可取无限次，朴素三层循环O(N*V*V)会超时，应优化为f[j]=max(f[j],f[j-v[i]]+w[i])正序遍历容量j实现O(N*V)。", "fullCode":"#include<iostream>\nusing namespace std;\nconst int N=1010;\nint f[N][N];\nint v[N],w[N];\nint main()\n{\n    int n,m;\n    cin>>n>>m;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>v[i]>>w[i];\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n        {\n            for(int k=0;k*v[i]<=j;k++)\n                f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+k*w[i]);\n        }\n    cout<<f[n][m]<<endl;\n}", "fullProblem":"# LinK64 林克的完全背包\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p>搞定了01背包问题，林克继续挑战完全背包问题：</p><p><img src=\"https://pic4.zhimg.com/80/v2-6fc1150fbb9af0f4ea680b29f2ebea23_720w.jpg\" /><br /></p><p>有N种物品和一个容量是V的背包，每种物品都有无限件可用。</p><p>第i种物品的体积是vi，价值是wi。</p><p>求解将哪些物品装入背包，可使这些物品的总体积不超过背包容量，且总价值最大。<br />输出最大价值。</p><p><span style=\"color: rgb(227, 55, 55);\">数据范围</span><br /></p><p><span style=\"color: rgb(227, 55, 55);\">0&lt;N,V≤1000<br />0&lt;vi,wi≤1000</span></p>\n\n## 输入描述\n\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行两个整数vi,wi，用空格隔开，分别表示第i种物品的体积和价值。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n7 884\n6148 6786\n8500 8620\n6136 6930\n8700 6732\n409 3388\n9925 642\n4324 5208\n```\n\n#### 输出\n\n```text\n6776\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/video/945/\" target=\"_blank\">acwing讲解</a></p>\n" },
  { "id":"pLinK65", "title":"多重背包问题1", "thinking":"本题考查多重背包的朴素解法，数据范围小(N,V,s≤100)，直接三层循环枚举物品、容量、件数，用f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+w[i]*k)转移即可。", "code":"// 三重循环枚举物品-容量-件数进行0/1背包变形转移\nfor(int i=1;i<=n;i++)\n    for(int j=0;j<=m;j++)\n        for(int k=0;k<=s[i];k++)\n            if(j>=v[i]*k) f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+w[i]*k);", "summary":"朴素多重背包O(NVS)在数据范围小时可直接用，每件物品拆成有限个同种物品就是0/1背包的思路，当S变大需用二进制优化或单调队列优化。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N =110;\nint n,m;\nint v[N],w[N],s[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=1;i<=n;i++) cin>>v[i]>>w[i]>>s[i];\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n            for(int k=0;k<=s[i];k++)\n                if(j>=v[i]*k) f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+w[i]*k);\n    cout<<f[n][m]<<endl;\n    return 0;\n}\n", "fullProblem":"# LinK65 多重背包问题(1)\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/f54a4768cf.png\" width=\"600\" height=\"322.2488038277512\" /><br /></p><p style=\"margin-left: 0px;\">有N种物品和一个容量是V的背包。</p><p>第i种物品最多有si件，每件体积是vi，价值是wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。<br />输出最大价值。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p><span style=\"color: rgb(227, 55, 55);\">0&lt;N,V≤100<br />0&lt;vi,wi,si≤100</span></p>\n\n## 输入描述\n\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行三个整数vi,wi,si，用空格隔开，分别表示第i种物品的体积、价值和数量。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4 5\n1 2 3\n2 4 1\n3 4 3\n4 5 2\n```\n\n#### 输出\n\n```text\n10\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/4/\" target=\"_blank\">原题链接</a><br /></p>\n" },
  { "id":"pLinK66", "title":"多重背包问题2", "thinking":"本题考察多重背包的二进制优化，利用2的幂次将每种物品拆分为logSi个新物品，转化为01背包，避免三重循环超时。", "code":"// 二进制拆分：将数量s拆成1,2,4,...份，每组打包成一个01物品\nwhile(k<=s) { v[++cnt]=a*k; w[cnt]=b*k; s-=k; k*=2; }\nif(s>0) { v[++cnt]=a*s; w[cnt]=b*s; }\n// 01背包滚动数组优化，体积倒序枚举\nfor(int i=1;i<=n;i++) for(int j=m;j>=v[i];j--)\n    f[j]=max(f[j],f[j-v[i]]+w[i]);", "summary":"多重背包二进制优化的核心思想是将数量si按二进制分解为logSi个组，每组看作一个新物品做01背包，复杂度从O(N*V*Si)降为O(N*V*logSi)，注意打包时系数k从1开始翻倍，剩余不足的部分单独成组。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=12010,M=2010;\nint n,m;\nint v[N],w[N];\nint f[M];\nint main()\n{\n    cin>>n>>m;\n    int cnt=0;\n    for (int i = 0; i < n; i++)\n    {\n        int a,b,s;\n        cin>>a>>b>>s;\n        int k=1;\n        while(k<=s)\n        {\n            cnt++;\n            v[cnt]=a*k;\n            w[cnt]=b*k;\n            s-=k;\n            k*=2;\n        }\n        if(s>0)\n        {\n            cnt++;\n            v[cnt]=a*s;\n            w[cnt]=b*s;\n        }\n    }\n    n=cnt;\n    for(int i=1;i<=n;i++)\n        for(int j=m;j>=v[i];j--)\n            f[j]=max(f[j],f[j-v[i]]+w[i]);\n    cout<<f[m]<<endl;\n    return 0;\n}", "fullProblem":"# LinK66 多重背包问题(2)\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/205e8efc71.png\" width=\"600\" height=\"322.2488038277512\" /><br /></p><p style=\"margin-left: 0px;\">有N种物品和一个容量是V的背包。</p><p>第i种物品最多有si件，每件体积是vivi，价值是wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。<br />输出最大价值。</p><p><img alt=\"image.png\" src=\"/public/upload/d98a38438e.png\" width=\"174\" height=\"106\" /><br /></p><h5>提示：</h5><p>本题考查多重背包的二进制优化方法。</p>\n\n## 输入描述\n\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行三个整数vi,wi,si，用空格隔开，分别表示第i种物品的体积、价值和数量。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4 5\n1 2 3\n2 4 1\n3 4 3\n4 5 2\n```\n\n#### 输出\n\n```text\n10\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/5/\" target=\"_blank\">原题链接</a></p>\n" },
  { "id":"pLinK67", "title":"分组背包问题", "thinking":"本题是分组背包模板题，核心在于将组内物品选择转化为在容量递减循环下遍历组内所有物品做01背包决策，从而保证每组最多选一个。", "code":"for(int i=1;i<=n;i++)              // 枚举组\n    for(int j=m;j>=1;j--)          // 容量倒序，确保每组只选一个\n        for(int k=1;k<=s[i];k++)   // 遍历组内物品\n            if(v[i][k]<=j)\n                f[j]=max(f[j],f[j-v[i][k]]+w[i][k]);  // 01背包转移", "summary":"分组背包的关键是将物品枚举放在容量循环内部，通过容量倒序保证每组至多选一件物品，本质是每个分组内的01背包。", "fullCode":"#include<iostream>\n#include<cstdio>\n#include<algorithm>\nusing namespace std;\nint n,m;\nint v[110][110],w[110][110],f[110],s[110];\nint main()\n{\n    scanf(\"%d%d\",&n,&m);\n    for(int i=1;i<=n;i++)\n    {\n        scanf(\"%d\",&s[i]);\n        for(int j=1;j<=s[i];j++)\n            scanf(\"%d%d\",&v[i][j],&w[i][j]);\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=m;j>=1;j--)\n            for(int k=1;k<=s[i];k++)\n            {\n                if(v[i][k]<=j)\n                f[j]=max(f[j],f[j-v[i][k]]+w[i][k]);\n            }\n    printf(\"%d\",f[m]);\n    return 0;\n}", "fullProblem":"# LinK67 分组背包问题\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/904c138622.png\" width=\"600\" height=\"311.04477611940297\" /><br /></p><p style=\"margin-left: 0px;\">有N组物品和一个容量是V的背包。</p><p>每组物品有若干个，同一组内的物品最多只能选一个。<br />每件物品的体积是vij，价值是wij，其中i是组号，j是组内编号。</p><p>求解将哪些物品装入背包，可使物品总体积不超过背包容量，且总价值最大。</p><p>输出最大价值。</p><p><img alt=\"image.png\" src=\"/public/upload/3d0e1e535d.png\" width=\"156\" height=\"118\" /><br /></p>\n\n## 输入描述\n\n<p>第一行有两个整数N，V用空格隔开，分别表示物品组数和背包容量。</p><p>接下来有N组数据：</p><p><img alt=\"image.png\" src=\"/public/upload/5adac9c21a.png\" width=\"487\" height=\"72\" /><br /></p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 5\n2\n1 2\n2 4\n1\n3 4\n1\n4 5\n```\n\n#### 输出\n\n```text\n8\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/9/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/341/\" target=\"_blank\">Y总讲解(基础课)</a></p>\n" },
  { "id":"pLinK68", "title":"混合背包问题", "thinking":"本题考察混合背包问题的分类处理，通过判断物品类型分别使用完全背包正向遍历和多重背包（含01背包）二进制拆分后反向遍历求解DP。", "code":"// 完全背包正向遍历，多重背包二进制拆分后01背包反向遍历\nif(!s) for(int j=v;j<=m;j++) f[j]=max(f[j],f[j-v]+w);  // 完全背包\nelse { if(s==-1) s=1; for(int k=1;k<=s;k*2) { for(int j=m;j>=k*v;j--) f[j]=max(f[j],f[j-k*v]+k*w); s-=k; } if(s) for(int j=m;j>=s*v;j--) f[j]=max(f[j],f[j-s*v]+s*w); }  // 多重+01背包", "summary":"混合背包是01背包、完全背包、多重背包的统一框架，核心在于按s分类并利用二进制优化将多重背包拆为O(log s)个01物品；注意代码中k*2应为k*=2，否则退化为O(s)。", "fullCode":"#include<iostream>\n#include<cstring>\n#include<algorithm>\nusing namespace std;\nconst int N=1007;\nint n,m;\nint f[N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=0;i<n;i++)\n    {\n        int v,w,s;\n        cin>>v>>w>>s;\n        if(!s)\n        {\n            for(int j=v;j<=m;j++)\n            f[j]=max(f[j],f[j-v]+w);\n        }\n        else\n        {\n            if(s==-1) s=1;\n            for(int k=1;k<=s;k*2)\n            {\n                for(int j=m;j>=k*v;j--)\n                    f[j]=max(f[j],f[j-k*v]+k*w);\n                    s-=k;\n            }\n            if(s)\n            {\n                for(int j=m;j>=s*v;j--)\n                    f[j]=max(f[j],f[j-s*v]+s*w);\n            }\n        }\n    }\n    cout<<f[m]<<endl;\n    return 0;\n}", "fullProblem":"# LinK68 混合背包问题\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Java, Python3\n\n## 题目描述\n\n<p>有 N 种物品和一个容量是 V 的背包。</p><p>物品一共有三类：</p><p>第一类物品只能用1次（01背包）；</p><p>第二类物品可以用无限次（完全背包）；</p><p>第三类物品最多只能用 si 次（多重背包）；</p><p>每种体积是 vi，价值是 wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。</p><p>输出最大价值。</p>\n\n## 输入描述\n\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有 N 行，每行三个整数 vi,wi,si，用空格隔开，分别表示第 i 种物品的体积、价值和数量。</p><p>si=−1 表示第 i 种物品只能用1次；</p><p>si=0 表示第 i 种物品可以用无限次；</p><p>si&gt;0 表示第 i 种物品可以使用 si 次；</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4 5\n1 2 -1\n2 4 1\n3 4 0\n4 5 2\n```\n\n#### 输出\n\n```text\n8\n```\n" },
  { "id":"pLinK69", "title":"摘花生", "thinking":"经典二维网格DP，只能向东或向南走，用f[i][j]表示走到(i,j)的最大花生数，转移取上方和左方最大值加上当前格花生数。", "code":"// 状态转移：从北边或西边走过来，取较大值加上当前花生数\nfor(int i=1;i<=n;i++)\n    for(int j=1;j<=m;j++)\n        f[i][j]=max(f[i-1][j],f[i][j-1])+w[i][j];\nprintf(\"%d\\n\",f[n][m]);", "summary":"二维网格取数DP模板题，只能向右/下走，状态由左和上转移而来，注意多组数据重置即可。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=110;\nint n,m;\nint w[N][N];\nint f[N][N];\nint main()\n{\n    int T;\n    scanf(\"%d\",&T);\n    while(T--)\n    {\n        scanf(\"%d%d\",&n,&m);\n        for(int i=1;i<=n;i++)\n            for(int j=1;j<=m;j++)\n                scanf(\"%d\",&w[i][j]);\n        for(int i=1;i<=n;i++)\n            for(int j=1;j<=m;j++)\n                f[i][j]=max(f[i-1][j],f[i][j-1])+w[i][j];\n        printf(\"%d\\n\",f[n][m]);\n\n    }\n    return 0;\n}", "fullProblem":"# LinK69 摘花生\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Java, Python3\n\n## 题目描述\n\n<p>她来到一片有网格状道路的矩形花生地，从西北角进去，东南角出来。</p><p>地里每个道路的交叉点上都有种着一株花生苗，上面有若干颗花生，经过一株花生苗就能摘走该它上面所有的花生。</p><p>Hello Kitty只能向东或向南走，不能向西或向北走。</p><p>问Hello Kitty最多能够摘到多少颗花生。</p><p><br /></p><p><img src=\"https://cdn.acwing.com/media/article/image/2019/09/12/19_a8509f26d5-1.gif\" alt=\"1.gif\" /><br /></p>\n\n## 输入描述\n\n<p>第一行是一个整数<code>T</code>，代表一共有多少组数据。</p><p>接下来是<code>T</code>组数据。</p><p>每组数据的第一行是两个整数，分别代表花生苗的行数<code>R</code>和列数<code>C</code>。</p><p>每组数据的接下来<code>R</code>行数据，从北向南依次描述每行花生苗的情况。每行数据有<code>C</code>个整数，按从西向东的顺序描述了该行每株花生苗上的花生数目<code>M</code>。</p><p><strong>数据范围</strong></p><p>1 ≤<code>T</code>≤ 100</p><p>1 ≤<code>R</code>，<code>C</code>≤ 100</p><p>0 ≤<code>M</code>≤ 1000</p>\n\n## 输出描述\n\n<p>对每组输入数据，输出一行，内容为Hello Kitty能摘到得最多的花生颗数。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n2\n2 2\n1 1\n3 4\n2 3\n2 3 4\n1 6 5\n```\n\n#### 输出\n\n```text\n8\n16\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/1017/\" target=\"_blank\">原题链接</a></p><p><a href=\"http://www.example.comhttps://www.acwing.com/video/2332/\" target=\"_blank\">Y总讲解</a></p><p><a href=\"https://www.acwing.com/activity/content/code/content/112796/\" target=\"_blank\">Y总代码</a></p>\n" },
  { "id":"pLinK70", "title":"最低通行费", "thinking":"题目给定了2N-1的时间限制，意味着只能向右或向下走（不能走回头路），因此转化为经典的网格DP最小路径和问题，用f[i][j]表示从(1,1)到(i,j)的最小费用，转移方程为f[i][j]=min(f[i-1][j],f[i][j-1])+w[i][j]。", "code":"// 边界格直接赋值，其余从上方或左方转移取较小值\nif(i==1&&j==1) f[i][j]=w[i][j];\nelse {\n    f[i][j]=INF;\n    if(i>1) f[i][j]=min(f[i][j],f[i-1][j]+w[i][j]);\n    if(j>1) f[i][j]=min(f[i][j],f[i][j-1]+w[i][j]);\n}", "summary":"核心收获：2N-1的时间限制等价于只能向右或向下移动，将问题简化为经典DP；网格DP注意左上角边界特判，避免INF覆盖起点值。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=110,INF=1e9;\nint n;\nint w[N][N];\nint f[N][N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=1;i<=n;i++)\n        for(int j=1;j<=n;j++)\n            scanf(\"%d\",&w[i][j]);\n    for(int i=1;i<=n;i++)\n        for(int j=1;j<=n;j++)\n            if(i==1&&j==1) f[i][j]=w[i][j];\n            else\n            {\n                f[i][j]=INF;\n                if(i>1) f[i][j]=min(f[i][j],f[i-1][j]+w[i][j]);\n                if(j>1) f[i][j]=min(f[i][j],f[i][j-1]+w[i][j]);\n            }\n    printf(\"%d\\n\",f[n][n]);\n    return 0;\n}", "fullProblem":"# LinK70 最低通行费\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p>一个商人穿过一个N×N的正方形的网格，去参加一个非常重要的商务活动。</p><p>他要从网格的左上角进，右下角出。</p><p>每穿越中间1个小方格，都要花费1个单位时间。</p><p>商人必须在(2N - 1)个单位时间穿越出去。</p><p>而在经过中间的每个小方格时，都需要缴纳一定的费用。</p><p>这个商人期望在规定时间内用最少费用穿越出去。</p><p>请问至少需要多少费用？</p><p>注意：不能对角穿越各个小方格（即，只能向上下左右四个方向移动且不能离开网格）。</p>\n\n## 输入描述\n\n<p>第一行是一个整数，表示正方形的宽度N。</p><p>后面N行，每行N个不大于100的正整数，为网格上每个小方格的费用。</p><p><strong>数据范围</strong></p><p>1 ≤ N ≤ 100</p>\n\n## 输出描述\n\n<p>输出一个整数，表示至少需要的费用。</p><p><strong>样例解释</strong></p><p>样例中，最小值为109 = 1 + 2 + 5 + 7 + 9 + 12 + 19 + 21 + 33。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n5\n1  4  6  8  10\n2  5  7  15 17\n6  8  9  18 20\n10 11 12 19 21\n20 23 25 29 33\n```\n\n#### 输出\n\n```text\n109\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/1020/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/solution/content/51101/\" target=\"_blank\">参考题解</a></p><p><a href=\"https://www.acwing.com/activity/content/code/content/112797/\" target=\"_blank\">Y总代码</a></p><p><a href=\"https://www.acwing.com/video/353/\" target=\"_blank\">Y总讲解</a></p>\n" },
  { "id":"pLinK71", "title":"最长上升子序列", "thinking":"经典线性DP，枚举每个位置为结尾，向前找比它小的数转移最长长度，O(n²)即可求解。", "code":"// 经典LIS：f[i]表示以i结尾的最长上升子序列长度\nfor(int i=1;i<=n;i++) {\n    f[i]=1;\n    for(int j=1;j<i;j++)\n        if(a[j]<a[i]) f[i]=max(f[i],f[j]+1);\n}\nint res=0;\nfor(int i=1;i<=n;i++) res=max(res,f[i]);", "summary":"O(n²)的LIS模板题，DP转移时只考虑j<i且a[j]<a[i]的位置，最后在所有f[i]中取最大值；数据量小直接暴力，大数据需优化为二分+贪心O(nlogn)。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=1010;\nint n;\nint a[N],f[N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=1;i<=n;i++)\n        scanf(\"%d\",&a[i]);\n    for(int i=1;i<=n;i++)\n    {\n        f[i]=1;\n        for(int j=1;j<i;j++)\n            if(a[j]<a[i])\n                f[i]=max(f[i],f[j]+1);\n    }\n    int res=0;\n    for(int i=1;i<=n;i++) res=max(res,f[i]);\n    printf(\"%d\\n\",res);\n    return 0;\n}\n", "fullProblem":"# LinK71 最长上升子序列\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">给定一个长度为N的数列，求数值严格单调递增的子序列的长度最长是多少。</span><br /></p><p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/743ae6c848.png\" width=\"212\" height=\"87\" /><br /></span></p>\n\n## 输入描述\n\n<p>第一行包含整数N。</p><p>第二行包含N个整数，表示完整序列。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n7\n3 1 2 1 8 5 6\n```\n\n#### 输出\n\n```text\n4\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/897/\" target=\"_blank\">原题链接</a></p>\n" },
  { "id":"pLinK72", "title":"最长上升子序列2", "thinking":"考察最长上升子序列的O(nlogn)优化解法，利用贪心思想维护q数组表示长度为len的上升子序列的最小末尾值，通过二分查找确定每个a[i]能接在哪个长度之后。", "code":"// 二分查找第一个 q[mid] >= a[i] 的位置，用 a[i] 更新该位置维护最小末尾值\nwhile(l<r) { int mid=l+r+1>>1; if(q[mid]<a[i]) l=mid; else r=mid-1; }\nlen = max(len, r+1);\nq[r+1] = a[i];", "summary":"掌握了用二分+贪心将LIS从O(n^2)优化到O(nlogn)的核心技巧，关键在于理解q数组维护的是每种长度的最优末尾值而非真实的LIS序列。", "fullCode":"#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=100010;\nint n;\nint a[N];\nint q[N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=0;i<n;i++) scanf(\"%d\",&a[i]);\n    int len=0;\n    for(int i=0;i<n;i++)\n    {\n        int l=0,r=len;\n        while(l<r)\n        {\n            int mid=l+r+1>>1;\n            if(q[mid]<a[i]) l=mid;\n            else r=mid-1;\n        }\n        len=max(len,r+1);\n        q[r+1]=a[i];\n    }\n    printf(\"%d\\n\",len);\n    return 0;\n}", "fullProblem":"# LinK72 最长上升子序列(2)\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p>给定一个长度为N的数列，求数值严格单调递增的子序列的长度最长是多少。<br /></p><p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/77823fbbb0.png\" width=\"209\" height=\"85\" /></span><br /></p>\n\n## 输入描述\n\n<p>第一行包含整数N。</p><p>第二行包含N个整数，表示完整序列。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n7\n3 1 2 1 8 5 6\n```\n\n#### 输出\n\n```text\n4\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/898/\" target=\"_blank\">原题链接</a></p>\n" },
  { "id":"pLinK73", "title":"拦截导弹", "thinking":"本题考察最长不上升子序列（LIS变种）和最少拦截系统数（Dilworth定理/贪心划分），用O(n²)的DP求最长不升子序列长度，再用贪心对每个导弹找第一个可拦截的系统更新其末尾高度即可得到最少系统数。", "code":"// 最长不升子序列（DP）与最少系统数（贪心）\nfor(int i=0;i<n;i++) {\n    f[i]=1;\n    for(int j=0;j<i;j++)\n        if(h[i]<=h[j]) f[i]=max(f[i],f[j]+1);\n    res=max(res,f[i]);\n    int k=0;\n    while(k<cnt&&q[k]<h[i]) k++;\n    if(k==cnt) q[cnt++]=h[i]; else q[k]=h[i];\n}", "summary":"第一问是LIS变种（不升子序列）的DP模板；第二问的贪心本质是用Dilworth定理将问题转化为求最长上升子序列长度，即最少不升子序列划分数 = 最长上升子序列长度。", "fullCode":"#include<iostream>\n#include<sstream>\n#include<algorithm>\nusing namespace std;\nconst int N=1010;\nint n;\nint h[N],f[N],q[N];\nint main()\n{\n    string line;\n    getline(cin,line);\n    stringstream ssin(line);\n    while(ssin>>h[n]) n++;\n    int res=0,cnt=0;\n    for(int i=0;i<n;i++)\n    {\n        f[i]=1;\n        for(int j=0;j<i;j++)\n            if(h[i]<=h[j])\n                f[i]=max(f[i],f[j]+1);\n        res=max(res,f[i]);\n        int k=0;\n        while(k<cnt&&q[k]<h[i]) k++;\n        if(k==cnt) q[cnt++]=h[i];\n        else q[k]=h[i];\n    }\n    printf(\"%d\\n\",res);\n    printf(\"%d\\n\",cnt);\n    return 0;\n}", "fullProblem":"# LinK73 拦截导弹\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><font>某国为了防御敌国的导弹袭击，发展出一种导弹</font><font>拦截系统。</font></p><p><font>但是这种导弹拦截系统有一个缺陷：虽然它的第一发炮弹能够到达任意的高度，但是以后每一发炮弹都不能高于前一发的高度。</font></p><p><font>某天，雷达捕捉到敌国的</font><font>导弹来袭。由于该系统还在试用阶段，所以只有一套系统，因此有可能不能拦截所有的导弹。</font><br /><br /><font>输入导弹依次飞来的高度（雷达给出的高度数据是不大于</font>30000的正整数），计算这套系统最多能拦截多少导弹，如果要拦截所有导弹最少要配备多少套这种导弹拦截系统。<br /></p>\n\n## 输入描述\n\n<p><font>一行，为导弹依次飞来的高度</font><br /></p>\n\n## 输出描述\n\n<p><font>两行，分别是最多能拦截的导弹数与要拦截所有导弹最少要配备的系统数</font><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n389 207 155 300 299 170 158 65\n```\n\n#### 输出\n\n```text\n6\n2\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/1012/\" target=\"_blank\">原题链接</a></p>\n" },
  { "id":"pLinK75", "title":"最长公共子序列", "thinking":"考查经典二维DP求LCS，f[i][j]表示A前i个字符与B前j个字符的最长公共子序列长度，按a[i]与b[j]是否相等分类转移", "code":"// 二维DP，相等则继承左上方+1，不等则取左/上最大值\nif(a[i]==b[j]) f[i][j]=f[i-1][j-1]+1;\nelse f[i][j]=max(f[i-1][j],f[i][j-1]);", "summary":"最长公共子序列是线性DP的经典模型，核心是理解字符匹配时由左上方转移、不匹配时由左边或上边继承的思想", "fullCode":"#include<iostream>\nusing namespace std;\nconst int N=1010;\nint n,m;\nchar a[N],b[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m>>a+1>>b+1;\n    for(int i=1;i<=n;i++)\n    {\n        for(int j=1;j<=m;j++)\n        {\n            if(a[i]==b[j])\n            {\n                f[i][j]=f[i-1][j-1]+1;\n            }\n            else\n            {\n                f[i][j]=max(f[i-1][j],f[i][j-1]);\n            }\n        }\n    }\n    cout<<f[n][m]<<'\\n';\n    return 0;\n}", "fullProblem":"# LinK75 最长公共子序列\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<h4><span style=\"color: rgb(51, 51, 51);\">给定两个长度分别为N和M的字符串A和B，求既是A的子序列又是B的子序列的字符串长度最长是多少。</span><br /></h4><h4 style=\"margin-left: 0px;\">数据范围</h4><p>1≤N,M≤1000</p>\n\n## 输入描述\n\n<p>第一行包含两个整数N和M。</p><p>第二行包含一个长度为N的字符串，表示字符串A。</p><p>第三行包含一个长度为M的字符串，表示字符串B。</p><p>字符串均由小写字母构成。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4 5\nacbd\nabedc\n```\n\n#### 输出\n\n```text\n3\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/899/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/946/\" target=\"_blank\">Y总讲解</a></p>\n" },
  { "id":"pLinK76", "title":"石子合并", "thinking":"本题是经典的区间DP模板题，核心思想是枚举区间长度和分割点，利用前缀和O(1)计算合并代价，通过f[i][j]=min(f[i][k]+f[k+1][j]+s[j]-s[i-1])转移求出合并成一堆的最小总代价。", "code":"memset(f,0x3f,sizeof f);                    // DP数组初始化为无穷大\nfor(int len=1;len<=n;len++)                 // 枚举区间长度\n    for(int i=1;i+len-1<=n;i++){int j=i+len-1; // 枚举区间左右端点\n        for(int k=i;k<j;k++)                // 枚举分割点\n            f[i][j]=min(f[i][j],f[i][k]+f[k+1][j]+s[j]-s[i-1]);} // 合并左右子区间+本次合并代价", "summary":"区间DP必须按照长度从小到大枚举，保证子区间已计算出最优解；合并任意区间[i,j]的最后一步代价恒为该区间总和s[j]-s[i-1]，这是DP正确性的前置条件。", "fullCode":"#include<iostream>\n#include<cstring>\nusing namespace std;\nconst int N=307;\nint a[N],s[N];\nint f[N][N];\nint main()\n{\n    int n;\n    cin>>n;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>a[i];\n        s[i]+=s[i-1]+a[i];\n    }\n    memset(f,0x3f,sizeof f);\n    for (int len = 0; len <=n; len++)\n    {\n        for (int i = 1; i +len-1<=n;i++)\n        {\n            int j=i+len-1;\n            if(len==1)\n            {\n                f[i][j]=0;\n                continue;\n            }\n            for(int k=i;k<=j-1;k++)\n            {\n                f[i][j]=min(f[i][j],f[i][k]+f[k+1][j]+s[j]-s[i-1]);\n            }\n        }\n        \n    }\n    cout<<f[1][n]<<endl;\n    return 0;\n}", "fullProblem":"# LinK76 石子合并\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C++\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/d47e1d10c6.png\" width=\"600\" height=\"336.8560105680317\" /><br /></p><p style=\"margin-left: 0px;\">设有N堆石子排成一排，其编号为1，2，3，…，N。</p><p>每堆石子有一定的质量，可以用一个整数来描述，现在要将这N堆石子合并成为一堆。</p><p>每次只能合并相邻的两堆，合并的代价为这两堆石子的质量之和，合并后与这两堆石子相邻的石子将和新堆相邻，合并时由于选择的顺序不同，合并的总代价也不相同。</p><p>例如有4堆石子分别为 1 3 5 2， 我们可以先合并1、2堆，代价为4，得到4 5 2， 又合并 1，2堆，代价为9，得到9 2 ，再合并得到11，总代价为4+9+11=24；</p><p>如果第二步是先合并2，3堆，则代价为7，得到4 7，最后一次合并代价为11，总代价为4+7+11=22。</p><p>问题是：找出一种合理的方法，使总的代价最小，输出最小代价。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p><span style=\"color: rgb(227, 55, 55);\">1≤N≤300</span></p>\n\n## 输入描述\n\n<p>第一行一个数N表示石子的堆数N。</p><p>第二行N个数，表示每堆石子的质量(均不超过1000)。</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最小代价。</span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n4\n1 3 5 2\n```\n\n#### 输出\n\n```text\n22\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/284/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/943/\" target=\"_blank\">ACWing讲解</a></p>\n" },
  { "id":"pLinK78", "title":"加分二叉树", "thinking":"区间DP经典题，枚举每个区间和根节点，左子树分数乘右子树分数加根节点权值，用root数组记录最优根，最后DFS输出前序遍历。", "code":"// 区间DP：f[l][r]为区间[l,r]的最大加分，root[l][r]记录最优根\nfor(int len=1;len<=n;len++)\n    for(int l=1;l+len-1<=n;l++) {\n        int r=l+len-1;\n        for(int k=l;k<=r;k++) {\n            int left = k==l ? 1 : f[l][k-1];\n            int right = k==r ? 1 : f[k+1][r];\n            int score = left * right + w[k];\n            if(l==r) score = w[k];\n            if(f[l][r] < score) f[l][r] = score, root[l][r] = k;\n        }\n    }", "summary":"区间DP计算最优二叉树结构时，需同步记录根节点以实现前序遍历输出，空子树分数初始化为1是边界关键。", "fullCode":"#include<iostream>\n#include<cstring>\n#include<cstdio>\n#include<algorithm>\nusing namespace std;\n\ntypedef pair<int,int> PII;\nconst int N=50;\nint n;\nint w[N];\nunsigned f[N][N];\nint root[N][N];\n\nvoid dfs(int l,int r)\n{\n    if(l>r) return;\n    int k=root[l][r];\n    printf(\"%d \",k);\n    dfs(l,k-1);\n    dfs(k+1,r);\n}\n\nint main()\n{\n    scanf(\"%d\",&n);\n    for (int i = 1; i <= n; i++) \n    {\n        scanf(\"%d\",&w[i]);\n    }\n    \n    for(int len=1;len<=n;len++)\n        for(int l=1;l+len-1<=n;l++)\n        {\n            int r=l+len-1;\n            for(int k=l;k<=r;k++) \n            {\n                int left=k==l?1:f[l][k-1];\n                int right=k==r?1:f[k+1][r];\n                int score=left*right+w[k];\n                if(l==r) score=w[k];\n                \n                if(f[l][r]<score)\n                {\n                    f[l][r]=score;\n                    root[l][r]=k;\n                }\n            }\n        }\n    printf(\"%d\\n\",f[1][n]); \n    dfs(1,n);\n    puts(\"\"); \n    return 0;\n}", "fullProblem":"# LinK78 加分二叉树\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Java, Python3\n\n## 题目描述\n\n\n\n## 输入描述\n\n\n\n## 输出描述\n\n\n" },
  { "id":"pLinK80", "title":"没有上司的舞会", "thinking":"树形DP入门题，用dfs在后序位置转移：f[u][0]表示不选u时子树的max，f[u][1]表示选u时子树的max，转移方程为f[u][0]+=max(f[v][0],f[v][1])，f[u][1]+=f[v][0]。最后取根节点两种状态的最大值。", "code":"// 树形DP：选父节点则子节点不能选，不选父节点子节点可选可不选\nvoid dfs(int u) {\n    f[u][1] = happy[u];\n    for (int v : g[u]) {\n        dfs(v);\n        f[u][0] += max(f[v][0], f[v][1]);\n        f[u][1] += f[v][0];\n    }\n}\n// 答案 = max(f[root][0], f[root][1])", "summary":"树形DP的核心是后序dfs通过子节点状态递推父节点状态，关键要找到根节点并理解相邻节点不能同时选的状态约束。", "fullCode":"#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nconst int N = 6010;\nint n, happy[N];\nvector<int> g[N];\nint f[N][2]; // f[u][0] = not choose u, f[u][1] = choose u\nbool has_father[N];\n\nvoid dfs(int u)\n{\n    f[u][1] = happy[u];\n    for (int v : g[u])\n    {\n        dfs(v);\n        f[u][0] += max(f[v][0], f[v][1]);\n        f[u][1] += f[v][0];\n    }\n}\n\nint main()\n{\n    cin >> n;\n    for (int i = 1; i <= n; i++)\n        cin >> happy[i];\n    for (int i = 0; i < n - 1; i++)\n    {\n        int l, k;\n        cin >> l >> k;\n        g[k].push_back(l);\n        has_father[l] = true;\n    }\n    int root = 1;\n    while (has_father[root])\n        root++;\n    dfs(root);\n    cout << max(f[root][0], f[root][1]) << endl;\n    return 0;\n}\n", "fullProblem":"# LinK80 没有上司的舞会\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\nUral大学有N名职员，编号为1~N。\n他们的关系就像一棵以校长为根的树，父节点就是子节点的直接上司。\n每个职员有一个快乐指数，用整数Hi给出，其中1≤i≤N。\n现在要召开一场周年庆宴会，不过，没有职员愿意和直接上司一起参会。\n在满足这个条件的前提下，主办方希望邀请一部分职员参会，使得所有参会职员的快乐指数总和最大，求这个最大值。\n\n数据范围\n1≤N≤6000,\n−128≤Hi≤127\n\n## 输入格式\n\n第一行一个整数N。\n接下来N行，第 i 行表示 i 号职员的快乐指数Hi。\n接下来N-1行，每行输入一对整数L, K,表示K是L的直接上司。\n\n## 输出格式\n\n输出最大的快乐指数。\n\n## 样例\n\n### 样例输入\n\n```\n7\n1\n1\n1\n1\n1\n1\n1\n1 3\n2 3\n6 4\n7 4\n4 5\n3 5\n```\n\n### 样例输出\n\n```\n5\n```\n\n## 提示\n\n[acwing讲解](https://www.acwing.com/video/471/)\n[原题链接](https://www.acwing.com/problem/content/287/)\n" }];

function esc(s) {
  if (s == null) return "";
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function buildCard(p) {
  var card = document.createElement('div');
  card.className = 'card';
  
  // Header
  var header = document.createElement('div');
  header.className = 'card-header';
  header.setAttribute('tabindex', '0');
  
  var badge = document.createElement('span');
  badge.className = 'id-badge';
  badge.textContent = p.id;
  
  var title = document.createElement('span');
  title.className = 'title';
  title.textContent = p.title;
  
  var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  icon.setAttribute('class', 'icon');
  icon.setAttribute('viewBox', '0 0 24 24');
  icon.setAttribute('fill', 'none');
  icon.setAttribute('stroke', 'currentColor');
  icon.setAttribute('stroke-width', '2');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'm6 9 6 6 6-6');
  icon.appendChild(path);
  
  header.appendChild(badge);
  header.appendChild(title);
  header.appendChild(icon);
  
  // Body
  var body = document.createElement('div');
  body.className = 'card-body';
  
  function addLabel(text) {
    var l = document.createElement('div');
    l.className = 'label';
    l.textContent = text;
    return l;
  }
  
  function addCodeBlock(code, showLang) {
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    if (showLang) {
      var lang = document.createElement('span');
      lang.className = 'lang';
      lang.textContent = 'C++';
      wrap.appendChild(lang);
    }
    var pre = document.createElement('pre');
    var codeEl = document.createElement('code');
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    wrap.appendChild(pre);
    return wrap;
  }
  
  // Thinking
  body.appendChild(addLabel('思路'));
  var thinking = document.createElement('div');
  thinking.className = 'thinking';
  thinking.textContent = p.thinking || '';
  body.appendChild(thinking);
  
  // Core code
  body.appendChild(addLabel('核心代码'));
  body.appendChild(addCodeBlock(p.code || '', true));
  
  // Summary
  body.appendChild(addLabel('总结'));
  var summary = document.createElement('div');
  summary.className = 'summary';
  summary.textContent = p.summary || '';
  body.appendChild(summary);
  
  // Buttons
  var toolbar = document.createElement('div');
  toolbar.className = 'btn-toolbar';
  
  var btnCode = document.createElement('button');
  btnCode.className = 'btn-toggle';
  btnCode.textContent = '📄 查看完整代码';
  
  var btnProblem = document.createElement('button');
  btnProblem.className = 'btn-toggle';
  btnProblem.textContent = '📝 查看完整题目';
  
  toolbar.appendChild(btnCode);
  toolbar.appendChild(btnProblem);
  body.appendChild(toolbar);
  
  // Full code section
  var fullCodeSec = document.createElement('div');
  fullCodeSec.className = 'full-section';
  fullCodeSec.appendChild(addCodeBlock(p.fullCode || '', true));
  body.appendChild(fullCodeSec);
  
  // Full problem section
  var fullProbSec = document.createElement('div');
  fullProbSec.className = 'full-section';
  var mdContent = document.createElement('div');
  mdContent.className = 'md-content';
  mdContent.innerHTML = p.fullProblem || '';
  fullProbSec.appendChild(mdContent);
  body.appendChild(fullProbSec);
  
  card.appendChild(header);
  card.appendChild(body);
  
  // Toggle card open/close
  header.addEventListener('click', function() {
    card.classList.toggle('open');
  });
  header.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      card.classList.toggle('open');
    }
  });
  
  // Toggle full code
  btnCode.addEventListener('click', function(e) {
    e.stopPropagation();
    fullCodeSec.classList.toggle('open');
    btnCode.classList.toggle('active');
    btnCode.textContent = btnCode.classList.contains('active')
      ? '📄 收起完整代码' : '📄 查看完整代码';
  });
  
  // Toggle full problem
  btnProblem.addEventListener('click', function(e) {
    e.stopPropagation();
    fullProbSec.classList.toggle('open');
    btnProblem.classList.toggle('active');
    btnProblem.textContent = btnProblem.classList.contains('active')
      ? '📝 收起完整题目' : '📝 查看完整题目';
  });
  
  return card;
}

function render(problems) {
  var container = document.getElementById('cardList');
  document.getElementById('totalCount').textContent = problems.length;
  container.innerHTML = '';
  if (!problems.length) {
    container.innerHTML = '<div class="empty-state">没有匹配的题目</div>';
    return;
  }
  for (var i = 0; i < problems.length; i++) {
    container.appendChild(buildCard(problems[i]));
  }
}

// Search
document.getElementById('search').addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  if (!q) { render(PROBLEMS); return; }
  var filtered = [];
  for (var i = 0; i < PROBLEMS.length; i++) {
    if (PROBLEMS[i].id.toLowerCase().indexOf(q) !== -1 ||
        PROBLEMS[i].title.toLowerCase().indexOf(q) !== -1) {
      filtered.push(PROBLEMS[i]);
    }
  }
  render(filtered);
});

// Init
document.getElementById('updateDate').textContent = '2026-07-24';
render(PROBLEMS);
</script>
