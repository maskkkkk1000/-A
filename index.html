    "code": "// BFS 8方向马步找最短路径\nconst int dx[8]={-2,-2,-1,-1,1,1,2,2};\nconst int dy[8]={-1,1,-2,2,-2,2,-1,1};\nqueue<State> q; q.push({sx,sy,0}); dist[sx][sy]=0;\nwhile(!q.empty()){ auto u=q.front(); q.pop();\n  for(int d=0;d<8;d++){ int nx=u.x+dx[d],ny=u.y+dy[d];\n    if(nx>=0&&nx<R&&ny>=0&&ny<C&&g[nx][ny]!='*'&&dist[nx][ny]==-1)\n      dist[nx][ny]=u.step+1, q.push({nx,ny,u.step+1}); }}",
    "summary": "二维网格骑士最短路径直接BFS即可，马步偏移表和障碍物判断是核心，注意行列输入顺序是列在前行在后。",
    "fullCode": "#include <iostream>\n#include <queue>\n#include <cstring>\n#include <vector>\n#include <string>\nusing namespace std;\n\nstruct State\n{\n    int x, y, step;\n};\n\nconst int dx[8] = {-2, -2, -1, -1, 1, 1, 2, 2};\nconst int dy[8] = {-1, 1, -2, 2, -2, 2, -1, 1};\n\nint main()\n{\n    int C, R;\n    while (cin >> C >> R)\n    {\n        vector<string> g(R);\n        int sx = -1, sy = -1, tx = -1, ty = -1;\n        for (int i = 0; i < R; i++)\n        {\n            cin >> g[i];\n            for (int j = 0; j < C; j++)\n            {\n                if (g[i][j] == 'K')\n                {\n                    sx = i;\n                    sy = j;\n                }\n                if (g[i][j] == 'H')\n                {\n                    tx = i;\n                    ty = j;\n                }\n            }\n        }\n        vector<vector<int>> dist(R, vector<int>(C, -1));\n        queue<State> q;\n        q.push({sx, sy, 0});\n        dist[sx][sy] = 0;\n        int ans = -1;\n        while (!q.empty())\n        {\n            auto cur = q.front();\n            q.pop();\n            if (cur.x == tx && cur.y == ty)\n            {\n                ans = cur.step;\n                break;\n            }\n            for (int d = 0; d < 8; d++)\n            {\n                int nx = cur.x + dx[d];\n                int ny = cur.y + dy[d];\n                if (nx >= 0 && nx < R && ny >= 0 && ny < C && g[nx][ny] != '*' && dist[nx][ny] == -1)\n                {\n                    dist[nx][ny] = cur.step + 1;\n                    q.push({nx, ny, cur.step + 1});\n                }\n            }\n        }\n        cout << ans << endl;\n    }\n    return 0;\n}\n",
    "fullProblem": "# LinK54 骑士林克的怜悯(2)\n\n- 内部 ID：7517\n- 难度：Mid\n- 类型：OI\n- 时间限制：1000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n\n---\n\n## 题目描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/49550add79.png\" width=\"527\" height=\"315\" /><br /></p><p><span style=\"color: rgb(73, 80, 96);\">帮助自己的2D骑士同伴进入到变形棋盘世界不久，林克意识到既然棋盘可变，但是骑士们的战斗水平却没有长进。</span></p><p><span style=\"color: rgb(73, 80, 96);\">虽然可以在见到更多的风景，探索更多不同的空间，但是如果自身的实力没有提升，那么骑士们感受不到那真正的自由以及成长的快乐。</span></p><p>林克找到去到阿卡来研究所，得到新的道具——试炼棋盘。</p><p>这个新道具可以在骑士的2D空间中创造试炼场以及2D守护者，让骑士们可以开始实战演练，提升攻击力。</p><p>如下图是一个10列<span style=\"color: rgb(51, 51, 51);\">11行</span>的棋盘（11×10）：</p><p>K代表骑士的位置，H代表守护者的位置。</p><p>. 代表可移动的位置，*代表障碍物。</p><p><img alt=\"image.png\" src=\"/public/upload/7b7e6811e1.png\" width=\"231\" height=\"249\" /><br /></p><p><span style=\"color: rgb(51, 51, 51);\">骑士</span>可以按照下图中的A,B,C,D...这条路径用5次跳跃，抵达守护者的位置偷袭它。（有可能其它路线的长度也是5）：<br /></p><p><img alt=\"image.png\" src=\"/public/upload/dcd9484cd4.png\" width=\"236\" height=\"253\" /><br /></p><p>请问，2D骑士要偷袭守护者，至少要跳多少次？</p>\n\n## 输入格式\n\n<p>第一行： 两个数，表示棋盘的列数Column(&lt;=150)和行数Row(&lt;=150)</p><p>第二行到结尾: Row行Column列的棋盘。</p>\n\n\n## 输出格式\n\n<p>一个数，表示跳跃的最小次数。<br /></p>\n\n\n## 样例\n\n### 样例输入\n\n```text\n10 11\n..........\n....*.....\n..........\n...*.*....\n.......*..\n..*..*...H\n*.........\n...*...*..\n.K........\n...*.....*\n..*....*..\n\n15 18\n...............\n..*............\n...............\n...*........**.\n.......*.*.....\n...K.*.........\n...............\n..**...........\n.*....*......*.\n........**.*...\n...............\n.....*......*..\n.*........*....\n...............\n....H..........\n.**.*..*.......\n...............\n..*....*.......\n```\n\n### 样例输出\n\n```text\n5\n\n6\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/bv14i4y1t72T\" target=\"_blank\">Andy讲解</a></p>\n\n"

    "fullCode": "#include<iostream>\n#include<cstring>\n#include<algorithm>\n#include<queue>\n#include<utility>\nusing namespace std;\n#define N 1007\ntypedef pair<int,int> PII;\nchar area[N][N];\nint dist[N][N],n,m;\nint dx[]={-1,0,1,0},dy[]={0,1,0,-1};\nvoid printDistMap(int n,int m)\n{\n    for(int i=0;i<n;i++)\n    {\n        for(int j=0;j<m;j++)\n            cout <<dist[i][j]<<\" \";\n        cout<<endl;\n    }\n}\nvoid bfs()\n{\n    queue<PII> q;\n    memset(dist,-1,sizeof(dist));\n    for(int i=0;i<n;i++)\n    {\n        for(int j=0;j<m;j++)\n        {\n            if(area[i][j]=='1')\n            {\n                dist[i][j]=0;\n                q.push(make_pair(i,j));\n            }\n        }\n    }\n    while(q.size())\n    {\n        auto t=q.front();\n        q.pop();\n        for(int i=0;i<4;i++)\n        {\n            int x=t.first+dx[i],y=t.second+dy[i];\n            if(x<0||x>=n||y<0||y>=m||dist[x][y]!=-1) continue;\n            dist[x][y]=dist[t.first][t.second]+1;\n            q.push({x,y});\n        }\n    }\n}\nint main()\n{\n    cin>>n>>m;\n    for(int i=0;i<n;i++)\n        cin>>area[i];\n    bfs();\n    printDistMap(n,m);\n    return 0;\n}",
    "fullProblem": "# LinK55 公主的攻击范围\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/fc4f8b3e16.png\" width=\"844\" height=\"401\" /><br /></p><p>塞尔达公主瘦弱的身体里面蕴含着不可思议的神圣力量，这个力量从公主所在的位置释放，可以逐层扩散到加农污秽掌控的区域。</p><p>给定一个N行M列的区域，代号为1的区域是公主能力释放的初始区，代号为0的区域表示需要洁净的区域。</p><p>每经过1毫秒，公主的神圣之光向外扩散一格，洁净相邻区域（4个方向），请计算每个标记为0的区域中加农的势力最多还能得瑟几毫秒。</p><p><img alt=\"image.png\" src=\"/public/upload/247c7d8854.png\" width=\"962\" height=\"401\" /><br /></p><p>格子与格子之间的距离使用曼哈顿距离计算。</p><p>提示：<br /></p><p><img alt=\"image.png\" src=\"/public/upload/896fdea9e0.png\" width=\"721\" height=\"185\" /><br /></p><p><span style=\"color: rgb(51, 51, 51);\">根据如上公式可知：<span style=\"color: rgb(51, 51, 51);\">曼哈顿距离指</span>两点之间的行坐标i距离和列坐标j距离之和。</span><br /></p><p>题目的意思就是求出矩阵中所有节点为0的点，到节点为1的点的曼哈顿距离。</p>\n\n## 输入描述\n\n<p>第一行两个整数n,m。</p><p>接下来一个N行M列的01矩阵，数字之间没有空格。</p><h4>数据范围</h4><p>1≤N,M≤1000</p>\n\n## 输出描述\n\n<p><span style=\"color: rgb(51, 51, 51);\">一个N行M列的矩阵B，相邻两个整数之间用一个空格隔开。每个整数表示加农势力存在的毫秒数（最小<span style=\"color: rgb(51, 51, 51);\">曼哈顿距离值）</span></span><br /></p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 4\n0001\n0011\n0110\n```\n\n#### 输出\n\n```text\n3 2 1 0\n2 1 0 0\n1 0 0 1\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/BV1Rk4y1r7dH\" target=\"_blank\">Andy的讲解</a><br /></p><p><a href=\"https://www.acwing.com/problem/content/video/175/\" target=\"_blank\">ACWing讲解</a></p>\n"

  {
    "id": "pLinK56",
    "title": "滚石柱",
    "thinking": "本题是经典BFS最短路问题，核心在于将1x1x2长方体抽象为(x,y,lie)三维状态（立/横躺/竖躺），通过预计算next_state[3][4][3]转移表统一滚动逻辑，避免冗长的分情况讨论。",
    "code": "// 预计算3种姿态×4方向的滚动转移：(dx, dy, new_lie)\nint next_state[3][4][3] = {\n    {{-2,0,2},{1,0,2},{0,-2,1},{0,1,1}}, // 立着→上/下/左/右\n    {{-1,0,1},{1,0,1},{0,-1,0},{0,2,0}}, // 横躺\n    {{-1,0,0},{2,0,0},{0,-1,2},{0,1,2}}  // 竖躺\n};\n// BFS核心：用dist[x][y][lie]判重+记步，向4方向滚动并检查合法性\nwhile (q.size()) {\n    auto t = q.front(); q.pop();\n    if (t.x==e.x && t.y==e.y && t.lie==e.lie) return dist[t.x][t.y][t.lie];\n    for (int i=0;i<4;i++) {\n        State ns = {t.x+next_state[t.lie][i][0], t.y+next_state[t.lie][i][1], next_state[t.lie][i][2]};\n        if (is_valid(ns) && dist[ns.x][ns.y][ns.lie]==-1)\n            dist[ns.x][ns.y][ns.lie]=dist[t.x][t.y][t.lie]+1, q.push(ns);\n    }\n}",
    "summary": "处理不规则物体滚动时，把姿态压缩进状态维度的技巧比模拟物理旋转简洁得多，转移表next_state[lie][dir]可以集中管理所有滚动规则，避免大量if-else分支。",
    "fullCode": "#include <iostream>\n#include <cstring>\n#include <algorithm>\n#include <queue>\n\nusing namespace std;\n\n// 定义地图的最大长宽\nconst int N = 510;\n\n// 存储石柱的状态结构体\nstruct State {\n    int x, y, lie; // x, y 代表左上角位置；lie 代表状态 (0:立, 1:横躺, 2:竖躺)\n};\n\nint n, m; // 地图的行数和列数\nchar g[N][N]; // 存储地图字符\nint dist[N][N][3]; // 存储从起点到当前状态的最少步数，同时充当“判重”数组\n\n// 状态转移向量表：4个方向（上、下、左、右）在3种不同状态(lie=0, 1, 2)下的坐标和状态变化\n// next_state[lie][dir] = {dx, dy, next_lie}\n// 注意：这里的dx, dy是目标状态的“左上角”相对于当前状态“左上角”的相对偏移量\nint next_state[3][4][3] = {\n    // lie = 0 (立着)\n    {\n        {-2, 0, 2}, // 上：向上翻转，左上角往上移动2格，变为竖躺\n        {1, 0, 2},  // 下：向下翻转，左上角往下移动1格，变为竖躺\n        {0, -2, 1}, // 左：向左翻转，左上角往左移动2格，变为横躺\n        {0, 1, 1}   // 右：向右翻转，左上角往右移动1格，变为横躺\n    },\n    // lie = 1 (横躺着，占据 (x, y) 和 (x, y+1))\n    {\n        {-1, 0, 1}, // 上：整体向上滚一格，左上角往上移动1格，仍是横躺\n        {1, 0, 1},  // 下：整体向下滚一格，左上角往下移动1格，仍是横躺\n        {0, -1, 0}, // 左：向左立起来，左上角往左移动1格，变为立着\n        {0, 2, 0}   // 右：向右立起来，左上角往右移动2格，变为立着\n    },\n    // lie = 2 (竖躺着，占据 (x, y) 和 (x+1, y))\n    {\n        {-1, 0, 0}, // 上：向上立起来，左上角往上移动1格，变为立着\n        {2, 0, 0},  // 下：向下立起来，左上角往下移动2格，变为立着\n        {0, -1, 2}, // 左：整体向左滚一格，左上角往左移动1格，仍是竖躺\n        {0, 1, 2}   // 右：整体向右滚一格，左上角往右移动1格，仍是竖躺\n    }\n};\n\n// 检查坐标 (x, y) 是否在地图合法边界内\nbool check_bound(int x, int y) {\n    return x >= 0 && x < n && y >= 0 && y < m;\n}\n\n// 检查当前状态是否合法（不越界、不踩悬崖、立着时不踩易碎地面）\nbool is_valid(State s) {\n    // 首先检查左上角坐标是否越界，或者是否踩到悬崖 '#'\n    if (!check_bound(s.x, s.y) || g[s.x][s.y] == '#') return false;\n\n    // 分情况检查石柱占据的其余部分\n    if (s.lie == 0) {\n        // 立着的时候，不能踩在易碎地面 'E' 上\n        if (g[s.x][s.y] == 'E') return false;\n    }\n    else if (s.lie == 1) {\n        // 横躺时，检查右侧相邻格子 (x, y+1) 是否越界或踩到悬崖\n        if (!check_bound(s.x, s.y + 1) || g[s.x][s.y + 1] == '#') return false;\n    }\n    else if (s.lie == 2) {\n        // 竖躺时，检查下方相邻格子 (x+1, y) 是否越界或踩到悬崖\n        if (!check_bound(s.x + 1, s.y) || g[s.x + 1][s.y] == '#') return false;\n    }\n    \n    // 所有检查都通过，状态合法\n    return true;\n}\n\n// 广度优先搜索求最短步数\nint bfs(State start, State end) {\n    // 初始化步数数组为 -1，代表该状态尚未到达\n    memset(dist, -1, sizeof dist);\n    \n    queue<State> q; // 定义 BFS 队列\n    dist[start.x][start.y][start.lie] = 0; // 起点步数初始化为 0\n    // 注意：由于上面多打了一个start，修正为：\n    dist[start.x][start.y][start.lie] = 0; \n    q.push(start); // 将起点状态入队\n\n    while (!q.empty()) {\n        auto t = q.front(); // 取出队头状态\n        q.pop(); // 弹出队头\n\n        // 如果当前状态就是终点（立在终点 'O' 上），直接返回步数\n        if (t.x == end.x && t.y == end.y && t.lie == end.lie) return dist[t.x][t.y][t.lie];\n\n        // 尝试向 4 个方向滚动\n        for (int i = 0; i < 4; i++) {\n            // 根据当前状态的 lie 和滚动方向 i，计算下一步的状态\n            int next_x = t.x + next_state[t.lie][i][0];\n            int next_y = t.y + next_state[t.lie][i][1];\n            int next_lie = next_state[t.lie][i][2];\n\n            State next_s = {next_x, next_y, next_lie}; // 封装成新状态\n\n            // 1. 检查新状态是否合法；2. 检查新状态是否之前已经访问过 (dist == -1 代表未访问)\n            if (is_valid(next_s) && dist[next_x][next_y][next_lie] == -1) {\n                dist[next_x][next_y][next_lie] = dist[t.x][t.y][t.lie] + 1; // 步数 + 1\n                q.push(next_s); // 新状态入队\n            }\n        }\n    }\n\n    // 若队列为空仍未找到终点，说明无法到达，返回 -1\n    return -1;\n}\n\nint main() {\n    // 循环读入地图的长宽，当 n 和 m 均为 0 时结束输入\n    while (cin >> n >> m, n || m) {\n        // 读入整张地图\n        for (int i = 0; i < n; i++) cin >> g[i];\n\n        State start, end; // 定义起点和终点状态\n\n        // 扫描地图，寻找起点 'X' 和终点 'O'\n        for (int i = 0; i < n; i++) {\n            for (int j = 0; j < m; j++) {\n                if (g[i][j] == 'X') { // 找到了石柱的一部分\n                    // 如果它右边也是 'X'，说明初始状态是横躺 (lie=1)\n                    if (i + 1 < n && g[i + 1][j] == 'X') {\n                        start = {i, j, 2}; // 此时 (i,j) 是左上角，状态为竖躺\n                        g[i][j] = g[i + 1][j] = '.'; // 将其还原为普通地面，避免干扰后续判断\n                    }\n                    // 如果它下方也是 'X'，说明初始状态是竖躺 (lie=2)\n                    else if (j + 1 < m && g[i][j + 1] == 'X') {\n                        start = {i, j, 1}; // 此时 (i,j) 是左上角，状态为横躺\n                        g[i][j] = g[i][j + 1] = '.'; // 还原为普通地面\n                    }\n                    // 如果孤立一个 'X'，说明初始状态是立着的 (lie=0)\n                    else {\n                        start = {i, j, 0};\n                        g[i][j] = '.'; // 还原为普通地面\n                    }\n                }\n                else if (g[i][j] == 'O') { // 找到了目标终点\n                    end = {i, j, 0}; // 题目要求石柱最终要“立”在终点上\n                }\n            }\n        }\n\n        // 运行 BFS 并输出结果\n        int res = bfs(start, end);\n        if (res == -1) cout << \"Impossible\" << endl; // 无法到达\n        else cout << res << endl; // 输出最少步数\n    }\n\n    return 0;\n}",
    "fullProblem": "# LinK56 滚石柱\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/a1ca7e018c.png\" width=\"508\" height=\"358\" /><br /></p><p>努力练习用磁铁拖拉滚动大铁箱的林克，想起了自己小时候喜欢的一个游戏，<a href=\"https://www.albinoblacksheep.com/games/bloxorz\" target=\"_blank\">滚石柱</a>。</p><p><img alt=\"image.png\" src=\"http://www.xmuoj.com/public/upload/2f88248417.png\" width=\"689\" height=\"271\" /><br /></p><p>这个游戏的任务是滚动一个1×1×2的长方体<span style=\"color: rgb(51, 51, 51);\">石柱</span>，把它滚动到目的地。</p><p>石柱在地面上有3种放置形式，“立”在地面上（1×1的面接触地面）横“躺”或者竖“趟”在地面上（1×2的面接触地面）</p><p><img alt=\"image.png\" src=\"/public/upload/283bd916f0.png\" width=\"768\" height=\"191\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/2e32f16d7c.png\" width=\"760\" height=\"218\" /><br /></p><p>迷宫是一个N行M列的矩阵，每个位置可能是硬地（用”.”表示）、易碎地面（用”E”表示）、禁地（用”#”表示）、起点（用”X”表示）或终点（用”O”表示）。</p><p>在每一步操作中，可以按上下左右四个键之一。</p><p>按下按键之后，<span style=\"color: rgb(51, 51, 51);\">石柱</span>向对应的方向沿着棱滚动90度。</p><p>任意时刻，长方体不能有任何部位接触禁地，并且不能立在易碎地面上。</p><p>字符”X”标识长方体的起始位置，地图上可能有一个”X”或者两个相邻的”X”。</p><p>地图上唯一的一个字符”O”标识目标位置。</p><p>求把<span style=\"color: rgb(51, 51, 51);\">石柱</span>移动到目标位置（即立在”O”上）所需要的最少步数。</p><p>在移动过程中，”X”和”O”标识的位置都可以看作是硬地被利用。</p>\n\n## 输入描述\n\n<p>输入包含多组测试用例。</p><p>对于每个测试用例，第一行包括两个整数N和M。</p><p>接下来N行用来描述地图，每行包括M个字符，每个字符表示一块地面的具体状态。</p><p>当输入用例N=0，M=0时，表示输入终止，且该用例无需考虑。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p>3≤N,M≤500</p>\n\n## 输出描述\n\n<p>每个用例输出一个整数表示所需的最少步数，如果无解则输出”Impossible”。</p><p>每个结果占一行。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n7 7\n#######\n#..X###\n#..##O#\n#....E#\n#....E#\n#.....#\n#######\n0 0\n```\n\n#### 输出\n\n```text\n10\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/BV1oK411V7GF\" target=\"_blank\">Andy讲解</a><br /></p><p><a href=\"https://www.acwing.com/problem/content/video/174/\" target=\"_blank\">ACWing讲解</a></p><p><span style=\"color: rgb(51, 51, 51);\">《算法竞赛进阶指南》</span><br /></p>\n"

    "thinking": "稠密图正权单源最短路，用邻接矩阵存图，每轮O(n)找未访问最小dist结点，再O(n)松弛邻边，总体O(n²)经典Dijkstra实现。",
    "code": "int t=-1;\nfor(int j=1;j<=n;j++)\n    if(!st[j]&&(t==-1||dist[t]>dist[j])) t=j;   // 找当前未访问的距离最小结点\nfor(int j=1;j<=n;j++)\n    dist[j]=min(dist[j],dist[t]+g[t][j]);        // 用t松弛所有邻边\nst[t]=true;",
    "summary": "稠密图Dijkstra用O(n²)邻接矩阵实现，注意重边取min、自环跳过、不可达返回-1，memset(0x3f)初始化为INF的技巧需记牢。",
    "fullCode": "#include<iostream>\n#include<algorithm>\n#include<cstring>\nusing namespace std;\nconst int N=510;\nint n,m;\nint g[N][N];\nint dist[N];\nbool st[N];\nint dijkstra()\n{\n    memset(dist,0x3f,sizeof dist);\n    dist[1]=0;\n    for (int i = 0; i < n-1; i++)\n    {\n        int t=-1;\n        for(int j=1;j<=n;j++)\n        {\n            if(!st[j]&&(t==-1||dist[t]>dist[j]))\n                t=j;\n        }\n        for(int j=1;j<=n;j++)\n        {\n            dist[j]=min(dist[j],dist[t]+g[t][j]);\n        }\n        st[t]=true;\n    }\n    if(dist[n]==0x3f3f3f3f)\n        return -1;\n    return dist[n];\n    \n}\nint main()\n{\n    scanf(\"%d %d\",&n,&m);\n    memset(g,0x3f,sizeof g);\n    while(m--)\n    {\n        int a,b,c;\n        scanf(\"%d %d %d\",&a,&b,&c);\n        g[a][b]=min(g[a][b],c);\n    }\n    printf(\"%d\\n\",dijkstra());\n    return 0;\n}",
    "fullProblem": "# LinK57 Dijkstra求最短路(1)\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\">给定一个n个点m条边的有向图，图中可能存在重边和自环，所有边权均为正值。</p><p>请你求出1号点到n号点的最短距离，如果无法从1号点走到n号点，则输出-1。</p><p><img alt=\"image.png\" src=\"/public/upload/ecc566c4b8.png\" width=\"211\" height=\"104\" /><br /></p>\n\n## 输入描述\n\n<p>第一行包含整数n和m。</p><p>接下来m行每行包含三个整数x，y，z，表示存在一条从点x到点y的有向边，边长为z。</p>\n\n## 输出描述\n\n<p>输出一个整数，表示1号点到n号点的最短距离。</p><p>如果路径不存在，则输出-1。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 3\n1 2 2\n2 3 1\n1 3 4\n```\n\n#### 输出\n\n```text\n3\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/851/\" target=\"_blank\">原题链接</a></p>\n"

    "thinking": "本题考查堆优化Dijkstra算法在稀疏图上的应用，使用邻接表存图、小根堆优先队列每次取出距离源点最近且未访问的顶点进行松弛操作。",
    "code": "// 堆优化Dijkstra:小根堆取最近点，邻接表松弛\npriority_queue<PII,vector<PII>,greater<PII>> heap; heap.push({0,1});\nwhile(heap.size()){auto t=heap.top();heap.pop();int v=t.second;\nif(st[v])continue;st[v]=true;\nfor(int i=h[v];~i;i=ne[i]){int j=e[i];\nif(dist[j]>dist[v]+w[i])dist[j]=dist[v]+w[i],heap.push({dist[j],j});}}",
    "summary": "稀疏图（m约等于n）必须用堆优化Dijkstra（邻接表+优先队列），否则O(n^2)朴素版本会超时；priority_queue的greater参数实现小根堆是关键技巧。",
    "fullCode": "#include<iostream>\n#include<cstring>\n#include<algorithm>\n#include<queue>\nusing namespace std;\ntypedef pair<int,int> PII;\nconst int N=1e6+10;\nint n,m;\nint h[N],w[N],e[N],ne[N],idx;\nint dist[N];\nbool st[N];\nvoid add(int a,int b,int c)\n{\n    e[idx]=b;\n    w[idx]=c;\n    ne[idx]=h[a];\n    h[a]=idx++;\n}\nint dijkstra()\n{\n    memset(dist,0x3f,sizeof dist);\n    dist[1]=0;\n    priority_queue<PII,vector<PII>,greater<PII>> heap;\n    heap.push({0,1});\n    while(heap.size())\n    {\n        auto t=heap.top();\n        heap.pop();\n        int ver =t.second,distance=t.first;\n        if(st[ver]) continue;\n        st[ver]=true;\n        for (int i = h[ver]; i !=-1; i=ne[i])\n        {\n            int j=e[i];\n            if(dist[j]>dist[ver]+w[i])\n            {\n                dist[j]=dist[ver]+w[i];\n                heap.push({dist[j],j});\n            }\n        }\n        \n    }\n    if(dist[n]==0x3f3f3f3f) return -1;\n    return dist[n];\n}\nint main()\n{\n    scanf(\"%d%d\",&n,&m);\n    memset(h,-1,sizeof h);\n    while(m--)\n    {\n        int a,b,c;\n        scanf(\"%d%d%d\",&a,&b,&c);\n        add(a,b,c);\n    }\n    cout<<dijkstra()<<endl;\n    return 0;\n}",
    "fullProblem": "# LinK58 Dijkstra求最短路(2)\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\">给定一个n个点m条边的有向图，图中可能存在重边和自环，所有边权均为非负值。</p><p>请你求出1号点到n号点的最短距离，如果无法从1号点走到n号点，则输出-1。</p><p><img alt=\"image.png\" src=\"/public/upload/eb7a99368d.png\" width=\"286\" height=\"76\" /><br /></p>\n\n## 输入描述\n\n<p>第一行包含整数n和m。</p><p>接下来m行每行包含三个整数x，y，z，表示存在一条从点x到点y的有向边，边长为z。</p>\n\n## 输出描述\n\n<p>输出一个整数，表示1号点到n号点的最短距离。</p><p>如果路径不存在，则输出-1。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 3\n1 2 2\n2 3 1\n1 3 4\n```\n\n#### 输出\n\n```text\n3\n```\n\n## 提示\n\n<p><a href=\"https://www.acwing.com/problem/content/852/\" target=\"_blank\">原题链接</a></p>\n"

    "code": "// 0-1BFS: 若当前元件方向匹配对角线则边权0，否则需旋转边权1\nint cost = (g[gx][gy] == wire[d]) ? 0 : 1;\nif (dist[x][y] + cost < dist[nx][ny]) {\n    dist[nx][ny] = dist[x][y] + cost;\n    (cost == 0) ? dq.push_front({nx, ny}) : dq.push_back({nx, ny});\n}",
    "summary": "学会将电路板格点抽象为(R+1)x(C+1)的图节点、元件方向映射为0/1边权，用双端队列BFS（0-1BFS）O(R*C)求解最小旋转次数，是典型的0-1权重图最短路建模。注意起点为(0,0)终点为(R,C)，以及ix/iy数组将方向映射到元件坐标的技巧。",
    "fullCode": "#include <iostream>\n#include <deque>\n#include <cstring>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Node\n{\n    int x, y;\n};\n\nconst int dx[4] = {-1, -1, 1, 1};\nconst int dy[4] = {-1, 1, -1, 1};\nconst int ix[4] = {-1, -1, 0, 0};\nconst int iy[4] = {-1, 0, -1, 0};\n// actual wire directions for '/' and '\\'\n// '/' connects (0,1) and (1,0), i.e., top-right and bottom-left\n// '\\' connects (0,0) and (1,1), i.e., top-left and bottom-right\nconst char wire[4] = {'\\\\', '/', '/', '\\\\'};\n\nint main()\n{\n    int T;\n    cin >> T;\n    while (T--)\n    {\n        int R, C;\n        cin >> R >> C;\n        vector<string> g(R);\n        for (int i = 0; i < R; i++)\n            cin >> g[i];\n\n        // 0-1 BFS: distance to each node (R+1)x(C+1)\n        vector<vector<int>> dist(R + 1, vector<int>(C + 1, 1e9));\n        deque<Node> dq;\n        dq.push_back({0, 0});\n        dist[0][0] = 0;\n\n        while (!dq.empty())\n        {\n            auto cur = dq.front();\n            dq.pop_front();\n            int x = cur.x, y = cur.y;\n\n            for (int d = 0; d < 4; d++)\n            {\n                int nx = x + dx[d], ny = y + dy[d];\n                if (nx < 0 || nx > R || ny < 0 || ny > C)\n                    continue;\n                int gx = x + ix[d], gy = y + iy[d];\n                // If current wire matches this diagonal, cost 0, else 1\n                int cost = (g[gx][gy] == wire[d]) ? 0 : 1;\n                if (dist[x][y] + cost < dist[nx][ny])\n                {\n                    dist[nx][ny] = dist[x][y] + cost;\n                    if (cost == 0)\n                        dq.push_front({nx, ny});\n                    else\n                        dq.push_back({nx, ny});\n                }\n            }\n        }\n        if (dist[R][C] == 1e9)\n            cout << \"NO SOLUTION\" << endl;\n        else\n            cout << dist[R][C] << endl;\n    }\n    return 0;\n}\n",
    "fullProblem": "# LinK59 维修电路\n\n- 内部 ID：7522\n- 难度：Mid\n- 类型：OI\n- 时间限制：1000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n\n---\n\n## 题目描述\n\n<p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/506795aaeb.png\" width=\"554\" height=\"311\" /><br /></span></p><p><span style=\"color: rgb(51, 51, 51);\">林克的大师摩托的飞行装置被撞坏了，极度影响他的卡丁车比赛。下图是飞行装置的</span>电路板示意图。</p><p>电路板的整体结构是一个R行C列的网格（R,C≤500）</p><p><span style=\"color: rgb(51, 51, 51);\"><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_be6ff7a219-%E7%94%B5%E8%B7%AF.png\" alt=\"电路.png\" /><br /></span></p><p>每个格点都是电线的接点，每个格子都包含一个电子元件。</p><p>电子元件的主要部分是一个<span style=\"color: rgb(227, 55, 55);\">可旋转</span>的、连接一条对角线上的两个接点的短电缆。</p><p>在旋转之后，它就可以连接另一条对角线的两个接点。</p><p>电路板左上角的接点接入直流电源，右下角的接点接入飞行车的发动装置。</p><p>林克发现因为某些元件的方向不小心发生了改变，电路板可能处于断路的状态。</p><p>请问如何旋转最少数量的元件，使电源与发动装置重新连同在一起呢？</p><p>注意：电流只能通过斜向的线段，水平和竖直线段不是电线。</p><p><br /></p><p>提示：<span style=\"color: rgb(51, 51, 51);\">只需要按照下面的方式旋转标准件，就可以使得电源和发动机之间连通。</span></p><p><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_a0e8e80a19-%E7%94%B5%E8%B7%AF2.png\" alt=\"电路2.png\" /><br /></p>\n\n## 输入格式\n\n<p>输入文件包含多组测试数据。</p><p>第一行包含一个整数T，表示测试数据的数目。</p><p>对于每组测试数据，第一行包含正整数R和C，表示电路板的行数和列数。</p><p>之后R行，每行C个字符，字符是<code>&quot;/&quot;</code>和<code>&quot;\\&quot;</code>中的一个，表示标准件的方向。</p><h4><b>数据范围</b></h4><p><img alt=\"image.png\" src=\"/public/upload/cc98c64485.png\" width=\"182\" height=\"65\" /></p>\n\n\n## 输出格式\n\n<p>对于每组测试数据，在单独的一行输出一个正整数，表示所需的最小旋转次数。</p><p>如果无论怎样都不能使得电源和发动机之间连通，输出NO SOLUTION。</p>\n\n\n## 样例\n\n### 样例输入\n\n```text\n1\n3 5\n\\\\/\\\\\n\\\\///\n/\\\\\\\\\n```\n\n### 样例输出\n\n```text\n1\n```\n\n## 提示\n\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1mC4y1W7Zr\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/177/\" target=\"_blank\">ACWing讲解</a></p><p>改编自《电路维修》</p>\n\n"

    "fullProblem": "# LinK60 突袭路线\n\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n\n## 题目描述\n\n<p><img alt=\"image.png\" src=\"/public/upload/d3817e11ae.png\" width=\"554\" height=\"272\" /><br /></p><p>为了解救公主，林克必须深入敌后。<br />在备战前，他拿出“关系分析仪”扫描敌营中每个士兵之间的关系。</p><p>关系分析仪的功能说明如下：<br />如果A的活动范围在B的眼皮底下，那么分析仪就会从B出发连一条射线指向A（B--&gt;A).</p><p>经过扫描，林克得到全营敌兵的相互关系。有些敌人被多个同伴看顾，有些敌人背后一个替他守望的都没有。</p><p>林克决定从背后没有人的敌人开始，潜伏到其背后，突袭之，并且避免被其他人发现。</p><p>军营一共有n个敌人，彼此之间的关系有m条射线，请找到一条可以逐个击破敌人的路线图。</p><p>如果找不到这样一条突袭路线，请则输出-1.</p><p><br />提示：<br />问题转化为：给定一个n个点m条边的有向图，点的编号是1到n，图中可能存在重边和自环。</p><p>请输出任意一个该有向图的拓扑序列，如果拓扑序列不存在，则输出-1。</p><p>若一个由图中所有点构成的序列A满足：对于图中的每条边(x, y)，x在A中都出现在y之前，则称A是该图的一个拓扑序列。</p><p><span style=\"color: rgb(227, 55, 55);\">数据范围：1≤n,m≤10^5</span></p>\n\n## 输入描述\n\n<p>第一行包含两个整数n和m</p><p>接下来m行，每行包含两个整数x和y，表示存在一条从点x到点y的有向边(x, y)。</p>\n\n## 输出描述\n\n<p>共一行，如果存在拓扑序列，则输出拓扑序列。</p><p>否则输出-1。</p>\n\n## 样例\n\n### 样例 1\n\n#### 输入\n\n```text\n3 3\n1 2\n2 3\n1 3\n```\n\n#### 输出\n\n```text\n1 2 3\n```\n\n## 提示\n\n<p><a href=\"https://www.bilibili.com/video/BV1x5411s7ev\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/video/280/\" target=\"_blank\">acwing讲解</a></p><p>改编自《<span style=\"color: rgb(73, 80, 96);\"><a href=\"https://www.acwing.com/problem/content/description/850/\" target=\"_blank\">有向图的拓扑序列</a>》</span></p>\n"

    "code": "// Dijkstra求最小油费: 状态(city, fuel)\ndist[u][f+1] = c + price[u]; // 加一单位油\npq.push({u, f+1, c + price[u]});\nfor (auto &e : g[u])\n    if (f >= e.d) // 油量够则走边\n        dist[e.to][f-e.d] = c, pq.push({e.to, f-e.d, c});",
    "summary": "二维状态Dijkstra：把油箱油量作为状态维度，每次决策只有加一单位油或沿边走，状态空间有限就能求解带油价差异的最短路问题。",
    "fullCode": "#include <iostream>\n#include <vector>\n#include <queue>\n#include <cstring>\n#include <algorithm>\nusing namespace std;\n\nstruct State\n{\n    int city, fuel, cost;\n    bool operator>(const State &o) const { return cost > o.cost; }\n};\n\nstruct Edge\n{\n    int to, d;\n};\n\nint main()\n{\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int N, M;\n    cin >> N >> M;\n    vector<int> price(N);\n    for (int i = 0; i < N; i++)\n        cin >> price[i];\n    vector<vector<Edge>> g(N);\n    while (M--)\n    {\n        int u, v, d;\n        cin >> u >> v >> d;\n        g[u].push_back({v, d});\n        g[v].push_back({u, d});\n    }\n    int q;\n    cin >> q;\n    while (q--)\n    {\n        int C, S, E;\n        cin >> C >> S >> E;\n        // Dijkstra on (city, fuel) state\n        vector<vector<int>> dist(N, vector<int>(C + 1, 1e9));\n        priority_queue<State, vector<State>, greater<State>> pq;\n        dist[S][0] = 0;\n        pq.push({S, 0, 0});\n        int ans = -1;\n        while (!pq.empty())\n        {\n            auto [u, f, c] = pq.top();\n            pq.pop();\n            if (c != dist[u][f])\n                continue;\n            if (u == E)\n            {\n                ans = c;\n                break;\n            }\n            // Option 1: refuel 1 unit\n            if (f < C && c + price[u] < dist[u][f + 1])\n            {\n                dist[u][f + 1] = c + price[u];\n                pq.push({u, f + 1, c + price[u]});\n            }\n            // Option 2: go along edges\n            for (auto &e : g[u])\n            {\n                if (f >= e.d && c < dist[e.to][f - e.d])\n                {\n                    dist[e.to][f - e.d] = c;\n                    pq.push({e.to, f - e.d, c});\n                }\n            }\n        }\n        if (ans == -1)\n            cout << \"impossible\" << endl;\n        else\n            cout << ans << endl;\n    }\n    return 0;\n}\n",
    "fullProblem": "# LinK61 最省赛程\n\n- 内部 ID：7524\n- 难度：High\n- 类型：OI\n- 时间限制：5000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n\n---\n\n## 题目描述\n\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/4af77a00ff.png\" width=\"388\" height=\"216\" /><br /></p><p style=\"margin-left: 0px;\">为了让自己能够驾驭大师摩托，打开了大师摩托的隐藏任务：“赛车试炼”。</p><p style=\"margin-left: 0px;\">然而这个特殊的赛车试炼，竟然比的不是车速，比的是如何“省”油钱。</p><p style=\"margin-left: 0px;\">林克需要驾驶不同邮箱容量各异的赛车，从起点城市S开到终点城市E。</p><p style=\"margin-left: 0px;\">有N个城市（编号0、1…N-1）和M条赛道(构成一张无向图)。<br /></p><p>在每个城市里边都有一个加油站，不同的加油站的单位油价不一样(有些城市油价贵，有些城市油价便宜些)。</p><p>请计算，如果林克驾驶的是一辆油箱容量为C的赛车，那么他从起点城市S开到终点城市E至少要花多少油钱？<br /></p><p><span style=\"color: rgb(51, 51, 51);\">注意：</span><span style=\"color: rgb(51, 51, 51);\">车子初始时油箱是空的，需要在起点城市加油方可起行。</span><br /></p>\n\n## 输入格式\n\n<p>第一行包含两个整数N和M。</p><p>第二行包含N个整数，代表N个城市的单位油价，第i个数即为第i个城市的油价Pi。</p><p>接下来M行，每行包括三个整数u,v,d，表示城市u与城市v之间存在道路，且赛车从u到v需要消耗的油量为d。</p><p>接下来一行包含一个整数q，代表问题数量（q&lt;100)</p><p>接下来q行，每行包含三个整数C、S、E，分别表示<span style=\"color: rgb(51, 51, 51);\">赛车</span>油箱容量、起点城市S、终点城市E。</p><p><b>数据范围：</b></p><p><img alt=\"image.png\" src=\"/public/upload/e861511252.png\" width=\"150\" height=\"120.33203125\" /><br /></p>\n\n\n## 输出格式\n\n<p>对于每个问题，输出一个整数，表示所需的最少油钱。</p><p>如果无法从起点城市开到终点城市，则输出”impossible”。</p><p>每个结果占一行。</p>\n\n\n## 样例\n\n### 样例输入\n\n```text\n5 5\n10 10 20 12 13\n0 1 9\n0 2 8\n1 2 1\n1 3 11\n2 3 7\n2\n10 0 3\n20 1 4\n```\n\n### 样例输出\n\n```text\n170\nimpossible\n```\n\n## 提示\n\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1sf4y1m7V5\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/178/\" target=\"_blank\">ACWing讲解</a></p><p>改变自《装满的油箱》</p>\n\n"

    "fullCode": "#include <iostream>\n#include <cmath>\n#include <algorithm>\nusing namespace std;\nconst int INF = 1e9;\n\nint V, N, ans = INF;\n\n// min volume for remaining layers\nint minV[25], minS[25];\n\nvoid dfs(int layer, int sumV, int sumS, int r, int h)\n{\n    if (layer == 0)\n    {\n        if (sumV == V)\n            ans = min(ans, sumS);\n        return;\n    }\n    // Pruning\n    if (sumV + minV[layer] > V)\n        return;\n    if (sumS + minS[layer] >= ans)\n        return;\n    // The max volume achievable from here\n    int maxV = 0;\n    for (int i = layer, rr = r - 1, hh = h - 1; i >= 1; i--, rr--, hh--)\n        maxV += rr * rr * hh;\n    if (sumV + maxV < V)\n        return;\n\n    // Try next radius and height\n    for (int i = r - 1; i >= layer; i--)\n    {\n        for (int j = h - 1; j >= layer; j--)\n        {\n            int v = i * i * j;\n            if (sumV + v > V)\n                continue;\n            int extraS = 2 * i * j;\n            if (layer == N)\n                extraS += i * i; // top surface of bottom layer\n            dfs(layer - 1, sumV + v, sumS + extraS, i, j);\n        }\n    }\n}\n\nint main()\n{\n    cin >> V >> N;\n    // Precompute min volume & surface for remaining k layers\n    for (int i = 1; i <= N; i++)\n    {\n        minV[i] = minV[i - 1] + i * i * i;\n        minS[i] = minS[i - 1] + 2 * i * i;\n    }\n    // The bottom layer cannot be too large\n    int maxR = sqrt(V) + 1;\n    int maxH = V + 1;\n    dfs(N, 0, 0, maxR, maxH);\n    cout << (ans == INF ? 0 : ans) << endl;\n    return 0;\n}\n",

    "fullCode": "#include <iostream>\n#include <cstring>\n#include <algorithm>\nusing namespace std;\n\nint dp[25][25][25]; // dp[w][h][m] = min max area\n\nint solve(int w, int h, int m)\n{\n    if (dp[w][h][m] != -1)\n        return dp[w][h][m];\n    if (m == 1)\n        return dp[w][h][m] = w * h;\n    if (w * h == m)\n        return dp[w][h][m] = 1;\n\n    int ans = 1e9;\n    // Cut horizontally\n    for (int i = 1; i < w; i++)\n        for (int k = 1; k < m; k++)\n        {\n            if (k <= i * h && m - k <= (w - i) * h)\n                ans = min(ans, max(solve(i, h, k), solve(w - i, h, m - k)));\n        }\n    // Cut vertically\n    for (int i = 1; i < h; i++)\n        for (int k = 1; k < m; k++)\n        {\n            if (k <= w * i && m - k <= w * (h - i))\n                ans = min(ans, max(solve(w, i, k), solve(w, h - i, m - k)));\n        }\n    return dp[w][h][m] = ans;\n}\n\nint main()\n{\n    int w, h, m;\n    memset(dp, -1, sizeof(dp));\n    while (cin >> w >> h >> m)\n    {\n        if (w == 0 && h == 0 && m == 0)\n            break;\n        cout << solve(w, h, m) << endl;\n    }\n    return 0;\n}\n",

    "fullCode": "#include <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nconst int N = 16;\nint ones[1 << N], cnt[1 << N];\nint row[N], col[N], cell[4][4];\nchar board[N][N];\n\nvoid init()\n{\n    for (int i = 0; i < (1 << N); i++)\n    {\n        int s = 0;\n        for (int j = 0; j < N; j++)\n            if (i >> j & 1)\n                s++;\n        ones[i] = s;\n    }\n    for (int i = 0; i < N; i++)\n        cnt[1 << i] = i;\n}\n\nint get(int x, int y)\n{\n    return row[x] & col[y] & cell[x / 4][y / 4];\n}\n\nint lowbit(int x)\n{\n    return x & -x;\n}\n\nbool dfs(int left)\n{\n    if (!left)\n        return true;\n\n    int minc = 20, mx = -1, my = -1;\n    for (int i = 0; i < N; i++)\n        for (int j = 0; j < N; j++)\n            if (board[i][j] == '-')\n            {\n                int cand = get(i, j);\n                int c = ones[cand];\n                if (c < minc)\n                {\n                    minc = c;\n                    mx = i;\n                    my = j;\n                }\n            }\n\n    if (mx == -1)\n        return false;\n\n    int cand = get(mx, my);\n    for (int k = cand; k; k -= lowbit(k))\n    {\n        int v = cnt[lowbit(k)];\n        board[mx][my] = 'A' + v;\n        row[mx] ^= (1 << v);\n        col[my] ^= (1 << v);\n        cell[mx / 4][my / 4] ^= (1 << v);\n        if (dfs(left - 1))\n            return true;\n        board[mx][my] = '-';\n        row[mx] ^= (1 << v);\n        col[my] ^= (1 << v);\n        cell[mx / 4][my / 4] ^= (1 << v);\n    }\n    return false;\n}\n\nint main()\n{\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    init();\n\n    string line;\n    while (getline(cin, line))\n    {\n        for (int i = 0; i < N; i++)\n        {\n            row[i] = (1 << N) - 1;\n            col[i] = (1 << N) - 1;\n        }\n        for (int i = 0; i < 4; i++)\n            for (int j = 0; j < 4; j++)\n                cell[i][j] = (1 << N) - 1;\n\n        if (line.empty())\n            continue;\n        int empty_cnt = 0;\n        for (int j = 0; j < N; j++)\n        {\n            board[0][j] = line[j];\n            if (line[j] != '-')\n            {\n                int v = line[j] - 'A';\n                row[0] ^= (1 << v);\n                col[j] ^= (1 << v);\n                cell[0 / 4][j / 4] ^= (1 << v);\n            }\n            else\n                empty_cnt++;\n        }\n        for (int i = 1; i < N; i++)\n        {\n            getline(cin, line);\n            for (int j = 0; j < N; j++)\n            {\n                board[i][j] = line[j];\n                if (line[j] != '-')\n                {\n                    int v = line[j] - 'A';\n                    row[i] ^= (1 << v);\n                    col[j] ^= (1 << v);\n                    cell[i / 4][j / 4] ^= (1 << v);\n                }\n                else\n                    empty_cnt++;\n            }\n        }\n\n        dfs(empty_cnt);\n\n        for (int i = 0; i < N; i++)\n        {\n            for (int j = 0; j < N; j++)\n                cout << board[i][j];\n            cout << endl;\n        }\n        cout << endl;\n    }\n    return 0;\n}\n",

    "fullCode": "#include <iostream>\n#include <vector>\n#include <queue>\n#include <cstring>\n#include <algorithm>\nusing namespace std;\n\nstruct State\n{\n    int city, fuel, cost;\n    bool operator>(const State &o) const { return cost > o.cost; }\n};\n\nstruct Edge\n{\n    int to, d;\n};\n\nint main()\n{\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int N, M;\n    cin >> N >> M;\n    vector<int> price(N);\n    for (int i = 0; i < N; i++)\n        cin >> price[i];\n    vector<vector<Edge>> g(N);\n    while (M--)\n    {\n        int u, v, d;\n        cin >> u >> v >> d;\n        g[u].push_back({v, d});\n        g[v].push_back({u, d});\n    }\n    int q;\n    cin >> q;\n    while (q--)\n    {\n        int C, S, E;\n        cin >> C >> S >> E;\n        // Dijkstra on (city, fuel) state\n        vector<vector<int>> dist(N, vector<int>(C + 1, 1e9));\n        priority_queue<State, vector<State>, greater<State>> pq;\n        dist[S][0] = 0;\n        pq.push({S, 0, 0});\n        int ans = -1;\n        while (!pq.empty())\n        {\n            auto [u, f, c] = pq.top();\n            pq.pop();\n            if (c != dist[u][f])\n                continue;\n            if (u == E)\n            {\n                ans = c;\n                break;\n            }\n            // Option 1: refuel 1 unit\n            if (f < C && c + price[u] < dist[u][f + 1])\n            {\n                dist[u][f + 1] = c + price[u];\n                pq.push({u, f + 1, c + price[u]});\n            }\n            // Option 2: go along edges\n            for (auto &e : g[u])\n            {\n                if (f >= e.d && c < dist[e.to][f - e.d])\n                {\n                    dist[e.to][f - e.d] = c;\n                    pq.push({e.to, f - e.d, c});\n                }\n            }\n        }\n        if (ans == -1)\n            cout << \"impossible\" << endl;\n        else\n            cout << ans << endl;\n    }\n    return 0;\n}\n",

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(problems) {
  const container = document.getElementById('cardList');
  document.getElementById('totalCount').textContent = problems.length;
  container.innerHTML = '';
  if (!problems.length) {
    container.innerHTML = '<div class="empty-state">没有匹配的题目</div>';
    return;
  }
  problems.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header" tabindex="0">
        <span class="id-badge">${esc(p.id)}</span>
        <span class="title">${esc(p.title)}</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="card-body">
        <div class="label">思路</div>
        <div class="thinking">${esc(p.thinking)}</div>
        <div class="label">核心代码</div>
        <div class="code-wrap"><span class="lang">C++</span><pre><code>${esc(p.code)}</code></pre></div>
        <div class="label">总结</div>
        <div class="summary">${esc(p.summary)}</div>
        <div class="btn-toolbar">
          <button class="btn-toggle" data-target="code-${p.id}">📄 查看完整代码</button>
          <button class="btn-toggle" data-target="problem-${p.id}">📝 查看完整题目</button>
        </div>
        <div class="full-section" id="code-${p.id}">
          <div class="code-wrap"><span class="lang">C++</span><pre><code>${esc(p.fullCode)}</code></pre></div>
        </div>
        <div class="full-section" id="problem-${p.id}">
          <div class="md-content">${esc(p.fullProblem)}</div>
        </div>
      </div>
    `;
    // Toggle card open/close
    const header = card.querySelector('.card-header');
    header.addEventListener('click', () => {
      card.classList.toggle('open');
    });
    header.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.toggle('open'); }
    });
    // Toggle buttons
    const buttons = card.querySelectorAll('.btn-toggle');
    buttons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = btn.dataset.target;
        const section = document.getElementById(targetId);
        if (section) {
          section.classList.toggle('open');
          btn.classList.toggle('active');
          btn.textContent = btn.classList.contains('active')
            ? (targetId.startsWith('code') ? '📄 收起完整代码' : '📝 收起完整题目')
            : (targetId.startsWith('code') ? '📄 查看完整代码' : '📝 查看完整题目');
        }
      });
    });
    container.appendChild(card);
  });
}

// Search
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { render(window.PROBLEMS); return; }
  const filtered = window.PROBLEMS.filter(p =>
    p.id.toLowerCase().includes(q) || p.title.toLowerCase().includes(q)
  );
  render(filtered);
});
