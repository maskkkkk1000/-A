攻击范围\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p><img alt=\"image.png\" src=\"/public/upload/fc4f8b3e16.png\" width=\"844\" height=\"401\" /><br /></p><p>塞尔达公主瘦弱的身体里面蕴含着不可思议的神圣力量，这个力量从公主所在的位置释放，可以逐层扩散到加农污秽掌控的区域。</p><p>给定一个N行M列的区域，代号为1的区域是公主能力释放的初始区，代号为0的区域表示需要洁净的区域。</p><p>每经过1毫秒，公主的神圣之光向外扩散一格，洁净相邻区域（4个方向），请计算每个标记为0的区域中加农的势力最多还能得瑟几毫秒。</p><p><img alt=\"image.png\" src=\"/public/upload/247c7d8854.png\" width=\"962\" height=\"401\" /><br /></p><p>格子与格子之间的距离使用曼哈顿距离计算。</p><p>提示：<br /></p><p><img alt=\"image.png\" src=\"/public/upload/896fdea9e0.png\" width=\"721\" height=\"185\" /><br /></p><p><span style=\"color: rgb(51, 51, 51);\">根据如上公式可知：<span style=\"color: rgb(51, 51, 51);\">曼哈顿距离指</span>两点之间的行坐标i距离和列坐标j距离之和。</span><br /></p><p>题目的意思就是求出矩阵中所有节点为0的点，到节点为1的点的曼哈顿距离。</p>\n<h2>输入描述</h2>\n<p>第一行两个整数n,m。</p><p>接下来一个N行M列的01矩阵，数字之间没有空格。</p><h4>数据范围</h4><p>1≤N,M≤1000</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">一个N行M列的矩阵B，相邻两个整数之间用一个空格隔开。每个整数表示加农势力存在的毫秒数（最小<span style=\"color: rgb(51, 51, 51);\">曼哈顿距离值）</span></span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>3 4\n0001\n0011\n0110</code></pre>\n#### 输出\n<pre><code>3 2 1 0\n2 1 0 0\n1 0 0 1</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.bilibili.com/video/BV1Rk4y1r7dH\" target=\"_blank\">Andy的讲解</a><br /></p><p><a href=\"https://www.acwing.com/problem/content/video/175/\" target=\"_blank\">ACWing讲解</a></p>"}, {"id": "LinK56", "title": "滚石柱", "thinking": "石柱有三种姿态（立、横躺、竖躺），用(x,y,lie)三元组表示状态，预先打好12种转移的表，然后BFS搜索最短路径。", "code": "int next[3][4][3]={{{-2,0,2},{1,0,2},{0,-2,1},{0,1,1}},\n    {{-1,0,1},{1,0,1},{0,-1,0},{0,2,0}},\n    {{-1,0,0},{2,0,0},{0,-1,2},{0,1,2}}};  // 姿态转移表\nbool valid(State s){\n    if(g[s.x][s.y]=='#')return false;\n    if(s.lie==0&&g[s.x][s.y]=='E')return false;  // 不能立在易碎格\n    return true;\n}", "summary": "滚石柱的核心在于预处理姿态转移表，表正确后BFS框架直接套用即可。", "fullCode": "#include <iostream>\n#include <cstring>\n#include <algorithm>\n#include <queue>\n\nusing namespace std;\n\nconst int N = 510;\n\nstruct State {\n    int x, y, lie;\n};\n\nint n, m;\nchar g[N][N];\nint dist[N][N][3];\n\nint next_state[3][4][3] = {\n\n    {\n        {-2, 0, 2},\n        {1, 0, 2},\n        {0, -2, 1},\n        {0, 1, 1}\n    },\n\n    {\n        {-1, 0, 1},\n        {1, 0, 1},\n        {0, -1, 0},\n        {0, 2, 0}\n    },\n\n    {\n        {-1, 0, 0},\n        {2, 0, 0},\n        {0, -1, 2},\n        {0, 1, 2}\n    }\n};\n\nbool check_bound(int x, int y) {\n    return x >= 0 && x < n && y >= 0 && y < m;\n}\n\nbool is_valid(State s) {\n\n    if (!check_bound(s.x, s.y) || g[s.x][s.y] == '#') return false;\n\n    if (s.lie == 0) {\n\n        if (g[s.x][s.y] == 'E') return false;\n    }\n    else if (s.lie == 1) {\n\n        if (!check_bound(s.x, s.y + 1) || g[s.x][s.y + 1] == '#') return false;\n    }\n    else if (s.lie == 2) {\n\n        if (!check_bound(s.x + 1, s.y) || g[s.x + 1][s.y] == '#') return false;\n    }\n\n    return true;\n}\n\nint bfs(State start, State end) {\n\n    memset(dist, -1, sizeof dist);\n\n    queue<State> q;\n    dist[start.x][start.y][start.lie] = 0;\n\n    dist[start.x][start.y][start.lie] = 0;\n    q.push(start);\n\n    while (!q.empty()) {\n        auto t = q.front();\n        q.pop();\n\n        if (t.x == end.x && t.y == end.y && t.lie == end.lie) return dist[t.x][t.y][t.lie];\n\n        for (int i = 0; i < 4; i++) {\n\n            int next_x = t.x + next_state[t.lie][i][0];\n            int next_y = t.y + next_state[t.lie][i][1];\n            int next_lie = next_state[t.lie][i][2];\n\n            State next_s = {next_x, next_y, next_lie};\n\n            if (is_valid(next_s) && dist[next_x][next_y][next_lie] == -1) {\n                dist[next_x][next_y][next_lie] = dist[t.x][t.y][t.lie] + 1;\n                q.push(next_s);\n            }\n        }\n    }\n\n    return -1;\n}\n\nint main() {\n\n    while (cin >> n >> m, n || m) {\n\n        for (int i = 0; i < n; i++) cin >> g[i];\n\n        State start, end;\n\n        for (int i = 0; i < n; i++) {\n            for (int j = 0; j < m; j++) {\n                if (g[i][j] == 'X') {\n\n                    if (i + 1 < n && g[i + 1][j] == 'X') {\n                        start = {i, j, 2};\n                        g[i][j] = g[i + 1][j] = '.';\n                    }\n\n                    else if (j + 1 < m && g[i][j + 1] == 'X') {\n                        start = {i, j, 1};\n                        g[i][j] = g[i][j + 1] = '.';\n                    }\n\n                    else {\n                        start = {i, j, 0};\n                        g[i][j] = '.';\n                    }\n                }\n                else if (g[i][j] == 'O') {\n                    end = {i, j, 0};\n                }\n            }\n        }\n\n        int res = bfs(start, end);\n        if (res == -1) cout << \"Impossible\" << endl;\n        else cout << res << endl;\n    }\n\n    return 0;\n}", "fullProblem": "# LinK56 滚石柱\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p><img alt=\"image.png\" src=\"/public/upload/a1ca7e018c.png\" width=\"508\" height=\"358\" /><br /></p><p>努力练习用磁铁拖拉滚动大铁箱的林克，想起了自己小时候喜欢的一个游戏，<a href=\"https://www.albinoblacksheep.com/games/bloxorz\" target=\"_blank\">滚石柱</a>。</p><p><img alt=\"image.png\" src=\"http://www.xmuoj.com/public/upload/2f88248417.png\" width=\"689\" height=\"271\" /><br /></p><p>这个游戏的任务是滚动一个1×1×2的长方体<span style=\"color: rgb(51, 51, 51);\">石柱</span>，把它滚动到目的地。</p><p>石柱在地面上有3种放置形式，“立”在地面上（1×1的面接触地面）横“躺”或者竖“趟”在地面上（1×2的面接触地面）</p><p><img alt=\"image.png\" src=\"/public/upload/283bd916f0.png\" width=\"768\" height=\"191\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/2e32f16d7c.png\" width=\"760\" height=\"218\" /><br /></p><p>迷宫是一个N行M列的矩阵，每个位置可能是硬地（用”.”表示）、易碎地面（用”E”表示）、禁地（用”#”表示）、起点（用”X”表示）或终点（用”O”表示）。</p><p>在每一步操作中，可以按上下左右四个键之一。</p><p>按下按键之后，<span style=\"color: rgb(51, 51, 51);\">石柱</span>向对应的方向沿着棱滚动90度。</p><p>任意时刻，长方体不能有任何部位接触禁地，并且不能立在易碎地面上。</p><p>字符”X”标识长方体的起始位置，地图上可能有一个”X”或者两个相邻的”X”。</p><p>地图上唯一的一个字符”O”标识目标位置。</p><p>求把<span style=\"color: rgb(51, 51, 51);\">石柱</span>移动到目标位置（即立在”O”上）所需要的最少步数。</p><p>在移动过程中，”X”和”O”标识的位置都可以看作是硬地被利用。</p>\n<h2>输入描述</h2>\n<p>输入包含多组测试用例。</p><p>对于每个测试用例，第一行包括两个整数N和M。</p><p>接下来N行用来描述地图，每行包括M个字符，每个字符表示一块地面的具体状态。</p><p>当输入用例N=0，M=0时，表示输入终止，且该用例无需考虑。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p>3≤N,M≤500</p>\n<h2>输出描述</h2>\n<p>每个用例输出一个整数表示所需的最少步数，如果无解则输出”Impossible”。</p><p>每个结果占一行。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>7 7\n#######\n#..X###\n#..##O#\n#....E#\n#....E#\n#.....#\n#######\n0 0</code></pre>\n#### 输出\n<pre><code>10</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.bilibili.com/video/BV1oK411V7GF\" target=\"_blank\">Andy讲解</a><br /></p><p><a href=\"https://www.acwing.com/problem/content/video/174/\" target=\"_blank\">ACWing讲解</a></p><p><span style=\"color: rgb(51, 51, 51);\">《算法竞赛进阶指南》</span><br /></p>"}, {"id": "LinK57", "title": "Dijkstra求最短路1", "thinking": "稠密图用朴素Dijkstra算法，邻接矩阵存图，每次选未确定最短距离中dist最小的点来松弛其他点，时间复杂度O(n^2)。", "code": "int dijkstra(){\n    memset(dist,0x3f,sizeof dist);dist[1]=0;\n    for(int i=0;i<n-1;i++){int t=-1;\n        for(int j=1;j<=n;j++)  // 找未确定中最短距离的点\n            if(!st[j]&&(t==-1||dist[t]>dist[j]))t=j;\n        st[t]=true;\n        for(int j=1;j<=n;j++)dist[j]=min(dist[j],dist[t]+g[t][j]);\n    }\n    return dist[n]==0x3f3f3f3f?-1:dist[n];\n}", "summary": "朴素Dijkstra适用于n不超过500的稠密图，n达到1e5时必须用堆优化版本。", "fullCode": "#include<iostream>\n#include<algorithm>\n#include<cstring>\nusing namespace std;\nconst int N=510;\nint n,m;\nint g[N][N];\nint dist[N];\nbool st[N];\nint dijkstra()\n{\n    memset(dist,0x3f,sizeof dist);\n    dist[1]=0;\n    for (int i = 0; i < n-1; i++)\n    {\n        int t=-1;\n        for(int j=1;j<=n;j++)\n        {\n            if(!st[j]&&(t==-1||dist[t]>dist[j]))\n                t=j;\n        }\n        for(int j=1;j<=n;j++)\n        {\n            dist[j]=min(dist[j],dist[t]+g[t][j]);\n        }\n        st[t]=true;\n    }\n    if(dist[n]==0x3f3f3f3f)\n        return -1;\n    return dist[n];\n\n}\nint main()\n{\n    scanf(\"%d %d\",&n,&m);\n    memset(g,0x3f,sizeof g);\n    while(m--)\n    {\n        int a,b,c;\n        scanf(\"%d %d %d\",&a,&b,&c);\n        g[a][b]=min(g[a][b],c);\n    }\n    printf(\"%d\\n\",dijkstra());\n    return 0;\n}", "fullProblem": "# LinK57 Dijkstra求最短路(1)\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\">给定一个n个点m条边的有向图，图中可能存在重边和自环，所有边权均为正值。</p><p>请你求出1号点到n号点的最短距离，如果无法从1号点走到n号点，则输出-1。</p><p><img alt=\"image.png\" src=\"/public/upload/ecc566c4b8.png\" width=\"211\" height=\"104\" /><br /></p>\n<h2>输入描述</h2>\n<p>第一行包含整数n和m。</p><p>接下来m行每行包含三个整数x，y，z，表示存在一条从点x到点y的有向边，边长为z。</p>\n<h2>输出描述</h2>\n<p>输出一个整数，表示1号点到n号点的最短距离。</p><p>如果路径不存在，则输出-1。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>3 3\n1 2 2\n2 3 1\n1 3 4</code></pre>\n#### 输出\n<pre><code>3</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/851/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK58", "title": "Dijkstra求最短路2", "thinking": "稀疏图用堆优化Dijkstra，邻接表存图，priority_queue小根堆每次取出当前最短距离的点进行松弛，时间复杂度O(mlogn)。", "code": "int dijkstra(){\n    memset(dist,0x3f,sizeof dist);dist[1]=0;\n    priority_queue<PII,vector<PII>,greater<PII>>heap;heap.push({0,1});\n    while(heap.size()){auto t=heap.top();heap.pop();\n        int ver=t.second,d=t.first;\n        if(st[ver])continue;st[ver]=true;\n        for(int i=h[ver];~i;i=ne[i]){int j=e[i];\n            if(dist[j]>d+w[i])dist[j]=d+w[i],heap.push({dist[j],j});  // 松弛\n        }\n    }\n    return dist[n]==0x3f3f3f3f?-1:dist[n];\n}", "summary": "堆优化版用priority_queue模拟小根堆，pair中dist在前ver在后，顺序反了会导致排序错误。", "fullCode": "#include<iostream>\n#include<cstring>\n#include<algorithm>\n#include<queue>\nusing namespace std;\ntypedef pair<int,int> PII;\nconst int N=1e6+10;\nint n,m;\nint h[N],w[N],e[N],ne[N],idx;\nint dist[N];\nbool st[N];\nvoid add(int a,int b,int c)\n{\n    e[idx]=b;\n    w[idx]=c;\n    ne[idx]=h[a];\n    h[a]=idx++;\n}\nint dijkstra()\n{\n    memset(dist,0x3f,sizeof dist);\n    dist[1]=0;\n    priority_queue<PII,vector<PII>,greater<PII>> heap;\n    heap.push({0,1});\n    while(heap.size())\n    {\n        auto t=heap.top();\n        heap.pop();\n        int ver =t.second,distance=t.first;\n        if(st[ver]) continue;\n        st[ver]=true;\n        for (int i = h[ver]; i !=-1; i=ne[i])\n        {\n            int j=e[i];\n            if(dist[j]>dist[ver]+w[i])\n            {\n                dist[j]=dist[ver]+w[i];\n                heap.push({dist[j],j});\n            }\n        }\n\n    }\n    if(dist[n]==0x3f3f3f3f) return -1;\n    return dist[n];\n}\nint main()\n{\n    scanf(\"%d%d\",&n,&m);\n    memset(h,-1,sizeof h);\n    while(m--)\n    {\n        int a,b,c;\n        scanf(\"%d%d%d\",&a,&b,&c);\n        add(a,b,c);\n    }\n    cout<<dijkstra()<<endl;\n    return 0;\n}", "fullProblem": "# LinK58 Dijkstra求最短路(2)\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\">给定一个n个点m条边的有向图，图中可能存在重边和自环，所有边权均为非负值。</p><p>请你求出1号点到n号点的最短距离，如果无法从1号点走到n号点，则输出-1。</p><p><img alt=\"image.png\" src=\"/public/upload/eb7a99368d.png\" width=\"286\" height=\"76\" /><br /></p>\n<h2>输入描述</h2>\n<p>第一行包含整数n和m。</p><p>接下来m行每行包含三个整数x，y，z，表示存在一条从点x到点y的有向边，边长为z。</p>\n<h2>输出描述</h2>\n<p>输出一个整数，表示1号点到n号点的最短距离。</p><p>如果路径不存在，则输出-1。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>3 3\n1 2 2\n2 3 1\n1 3 4</code></pre>\n#### 输出\n<pre><code>3</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/852/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK59", "title": "维修电路", "thinking": "格点图建模，当前斜线方向与要走的期望方向一致时代价为0，不一致时代价为1，用01BFS双端队列替代priority_queue提高效率。", "code": "int cost=(grid[gx][gy]==wire[d])?0:1;  // 匹配斜线方向cost=0\nif(dist[x][y]+cost<dist[nx][ny]){\n    dist[nx][ny]=dist[x][y]+cost;\n    if(cost==0)dq.push_front({nx,ny}); else dq.push_back({nx,ny});  // 01BFS\n}\nconst char wire[4]={'\\\\\\\\','/','/','\\\\\\\\'};", "summary": "01BFS常数比Dijkstra小很多，格点图节点数为(R+1)*(C+1)而非R*C。", "fullCode": "#include <iostream>\n#include <deque>\n#include <cstring>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Node\n{\n    int x, y;\n};\n\nconst int dx[4] = {-1, -1, 1, 1};\nconst int dy[4] = {-1, 1, -1, 1};\nconst int ix[4] = {-1, -1, 0, 0};\nconst int iy[4] = {-1, 0, -1, 0};\n\nconst char wire[4] = {'\\\\', '/', '/', '\\\\'};\n\nint main()\n{\n    int T;\n    cin >> T;\n    while (T--)\n    {\n        int R, C;\n        cin >> R >> C;\n        vector<string> g(R);\n        for (int i = 0; i < R; i++)\n            cin >> g[i];\n\n        vector<vector<int>> dist(R + 1, vector<int>(C + 1, 1e9));\n        deque<Node> dq;\n        dq.push_back({0, 0});\n        dist[0][0] = 0;\n\n        while (!dq.empty())\n        {\n            auto cur = dq.front();\n            dq.pop_front();\n            int x = cur.x, y = cur.y;\n\n            for (int d = 0; d < 4; d++)\n            {\n                int nx = x + dx[d], ny = y + dy[d];\n                if (nx < 0 || nx > R || ny < 0 || ny > C)\n                    continue;\n                int gx = x + ix[d], gy = y + iy[d];\n\n                int cost = (g[gx][gy] == wire[d]) ? 0 : 1;\n                if (dist[x][y] + cost < dist[nx][ny])\n                {\n                    dist[nx][ny] = dist[x][y] + cost;\n                    if (cost == 0)\n                        dq.push_front({nx, ny});\n                    else\n                        dq.push_back({nx, ny});\n                }\n            }\n        }\n        if (dist[R][C] == 1e9)\n            cout << \"NO SOLUTION\" << endl;\n        else\n            cout << dist[R][C] << endl;\n    }\n    return 0;\n}", "fullProblem": "# LinK59 维修电路\n- 内部 ID：7522\n- 难度：Mid\n- 类型：OI\n- 时间限制：1000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n<hr>\n<h2>题目描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/506795aaeb.png\" width=\"554\" height=\"311\" /><br /></span></p><p><span style=\"color: rgb(51, 51, 51);\">林克的大师摩托的飞行装置被撞坏了，极度影响他的卡丁车比赛。下图是飞行装置的</span>电路板示意图。</p><p>电路板的整体结构是一个R行C列的网格（R,C≤500）</p><p><span style=\"color: rgb(51, 51, 51);\"><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_be6ff7a219-%E7%94%B5%E8%B7%AF.png\" alt=\"电路.png\" /><br /></span></p><p>每个格点都是电线的接点，每个格子都包含一个电子元件。</p><p>电子元件的主要部分是一个<span style=\"color: rgb(227, 55, 55);\">可旋转</span>的、连接一条对角线上的两个接点的短电缆。</p><p>在旋转之后，它就可以连接另一条对角线的两个接点。</p><p>电路板左上角的接点接入直流电源，右下角的接点接入飞行车的发动装置。</p><p>林克发现因为某些元件的方向不小心发生了改变，电路板可能处于断路的状态。</p><p>请问如何旋转最少数量的元件，使电源与发动装置重新连同在一起呢？</p><p>注意：电流只能通过斜向的线段，水平和竖直线段不是电线。</p><p><br /></p><p>提示：<span style=\"color: rgb(51, 51, 51);\">只需要按照下面的方式旋转标准件，就可以使得电源和发动机之间连通。</span></p><p><img src=\"https://www.acwing.com/media/article/image/2019/01/16/19_a0e8e80a19-%E7%94%B5%E8%B7%AF2.png\" alt=\"电路2.png\" /><br /></p>\n<h2>输入格式</h2>\n<p>输入文件包含多组测试数据。</p><p>第一行包含一个整数T，表示测试数据的数目。</p><p>对于每组测试数据，第一行包含正整数R和C，表示电路板的行数和列数。</p><p>之后R行，每行C个字符，字符是<code>&quot;/&quot;</code>和<code>&quot;\\&quot;</code>中的一个，表示标准件的方向。</p><h4><b>数据范围</b></h4><p><img alt=\"image.png\" src=\"/public/upload/cc98c64485.png\" width=\"182\" height=\"65\" /></p>\n<h2>输出格式</h2>\n<p>对于每组测试数据，在单独的一行输出一个正整数，表示所需的最小旋转次数。</p><p>如果无论怎样都不能使得电源和发动机之间连通，输出NO SOLUTION。</p>\n<h2>样例</h2>\n<h3>样例输入</h3>\n<pre><code>1\n3 5\n\\\\/\\\\\n\\\\///\n/\\\\\\\\</code></pre>\n<h3>样例输出</h3>\n<pre><code>1</code></pre>\n<h2>提示</h2>\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1mC4y1W7Zr\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/177/\" target=\"_blank\">ACWing讲解</a></p><p>改编自《电路维修》</p>"}, {"id": "LinK60", "title": "突袭路线", "thinking": "拓扑排序可以用Kahn算法实现，将入度为0的节点不断入队并移除其出边，如果最终所有节点都被处理则得到拓扑序，否则说明存在环。", "code": "if(!d[i]) q[++tt]=i;  // 将入度为0的节点入队\nwhile(hh<=tt) {\n    int t=q[hh++];\n    for(int i=head[t];~i;i=ne[i])\n        if(--d[e[i]]==0) q[++tt]=e[i];\n}", "summary": "Kahn算法需要维护入度数组，最后检查tt是否等于n-1来判断是否存在环。", "fullCode": "#include<iostream>\n#include<algorithm>\n#include<queue>\n#include<cstring>\nusing namespace std;\n#define For(a,begin,end) for (int a=(begin);a<(end);a++)\nconst int N=10000007;\nint n,m;\nint head[N],edge[N],nextVertex[N],idx;\nint q[N],d[N];\nvoid add(int a,int b)\n{\n\n}", "fullProblem": "# LinK60 突袭路线\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p><img alt=\"image.png\" src=\"/public/upload/d3817e11ae.png\" width=\"554\" height=\"272\" /><br /></p><p>为了解救公主，林克必须深入敌后。<br />在备战前，他拿出“关系分析仪”扫描敌营中每个士兵之间的关系。</p><p>关系分析仪的功能说明如下：<br />如果A的活动范围在B的眼皮底下，那么分析仪就会从B出发连一条射线指向A（B--&gt;A).</p><p>经过扫描，林克得到全营敌兵的相互关系。有些敌人被多个同伴看顾，有些敌人背后一个替他守望的都没有。</p><p>林克决定从背后没有人的敌人开始，潜伏到其背后，突袭之，并且避免被其他人发现。</p><p>军营一共有n个敌人，彼此之间的关系有m条射线，请找到一条可以逐个击破敌人的路线图。</p><p>如果找不到这样一条突袭路线，请则输出-1.</p><p><br />提示：<br />问题转化为：给定一个n个点m条边的有向图，点的编号是1到n，图中可能存在重边和自环。</p><p>请输出任意一个该有向图的拓扑序列，如果拓扑序列不存在，则输出-1。</p><p>若一个由图中所有点构成的序列A满足：对于图中的每条边(x, y)，x在A中都出现在y之前，则称A是该图的一个拓扑序列。</p><p><span style=\"color: rgb(227, 55, 55);\">数据范围：1≤n,m≤10^5</span></p>\n<h2>输入描述</h2>\n<p>第一行包含两个整数n和m</p><p>接下来m行，每行包含两个整数x和y，表示存在一条从点x到点y的有向边(x, y)。</p>\n<h2>输出描述</h2>\n<p>共一行，如果存在拓扑序列，则输出拓扑序列。</p><p>否则输出-1。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>3 3\n1 2\n2 3\n1 3</code></pre>\n#### 输出\n<pre><code>1 2 3</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.bilibili.com/video/BV1x5411s7ev\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/video/280/\" target=\"_blank\">acwing讲解</a></p><p>改编自《<span style=\"color: rgb(73, 80, 96);\"><a href=\"https://www.acwing.com/problem/content/description/850/\" target=\"_blank\">有向图的拓扑序列</a>》</span></p>"}, {"id": "LinK61", "title": "最省赛程", "thinking": "将城市和当前油量组成状态二元组进行Dijkstra搜索，每次可以加一单位油产生cost，或者消耗油量沿边行驶到下一城市。", "code": "if(f<C && c+price[u] < dist[u][f+1])          // 在当前城市加一单位油\n    dist[u][f+1]=c+price[u], pq.push({u, f+1, c+price[u]});\nfor(auto &e : g[u])\n    if(f>=e.d && c < dist[e.to][f-e.d])        // 消耗e.d油量行驶到下一城市\n        dist[e.to][f-e.d]=c, pq.push({e.to, f-e.d, c});", "summary": "状态图Dijkstra将(city, fuel)作为二维状态，加油和行驶两种转移分别对应不同的维度变化。", "fullCode": "#include <iostream>\n#include <vector>\n#include <queue>\n#include <cstring>\n#include <algorithm>\nusing namespace std;\n\nstruct State\n{\n    int city, fuel, cost;\n    bool operator>(const State &o) const { return cost > o.cost; }\n};\n\nstruct Edge\n{\n    int to, d;\n};\n\nint main()\n{\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int N, M;\n    cin >> N >> M;\n    vector<int> price(N);\n    for (int i = 0; i < N; i++)\n        cin >> price[i];\n    vector<vector<Edge>> g(N);\n    while (M--)\n    {\n        int u, v, d;\n        cin >> u >> v >> d;\n        g[u].push_back({v, d});\n        g[v].push_back({u, d});\n    }\n    int q;\n    cin >> q;\n    while (q--)\n    {\n        int C, S, E;\n        cin >> C >> S >> E;\n\n        vector<vector<int>> dist(N, vector<int>(C + 1, 1e9));\n        priority_queue<State, vector<State>, greater<State>> pq;\n        dist[S][0] = 0;\n        pq.push({S, 0, 0});\n        int ans = -1;\n        while (!pq.empty())\n        {\n            auto [u, f, c] = pq.top();\n            pq.pop();\n            if (c != dist[u][f])\n                continue;\n            if (u == E)\n            {\n                ans = c;\n                break;\n            }\n\n            if (f < C && c + price[u] < dist[u][f + 1])\n            {\n                dist[u][f + 1] = c + price[u];\n                pq.push({u, f + 1, c + price[u]});\n            }\n\n            for (auto &e : g[u])\n            {\n                if (f >= e.d && c < dist[e.to][f - e.d])\n                {\n                    dist[e.to][f - e.d] = c;\n                    pq.push({e.to, f - e.d, c});\n                }\n            }\n        }\n        if (ans == -1)\n            cout << \"impossible\" << endl;\n        else\n            cout << ans << endl;\n    }\n    return 0;\n}", "fullProblem": "# LinK61 最省赛程\n- 内部 ID：7524\n- 难度：High\n- 类型：OI\n- 时间限制：5000ms\n- 内存限制：256MB\n- 支持语言：C、C++、Python3\n- 标签：校外实训\n<hr>\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/4af77a00ff.png\" width=\"388\" height=\"216\" /><br /></p><p style=\"margin-left: 0px;\">为了让自己能够驾驭大师摩托，打开了大师摩托的隐藏任务：“赛车试炼”。</p><p style=\"margin-left: 0px;\">然而这个特殊的赛车试炼，竟然比的不是车速，比的是如何“省”油钱。</p><p style=\"margin-left: 0px;\">林克需要驾驶不同邮箱容量各异的赛车，从起点城市S开到终点城市E。</p><p style=\"margin-left: 0px;\">有N个城市（编号0、1…N-1）和M条赛道(构成一张无向图)。<br /></p><p>在每个城市里边都有一个加油站，不同的加油站的单位油价不一样(有些城市油价贵，有些城市油价便宜些)。</p><p>请计算，如果林克驾驶的是一辆油箱容量为C的赛车，那么他从起点城市S开到终点城市E至少要花多少油钱？<br /></p><p><span style=\"color: rgb(51, 51, 51);\">注意：</span><span style=\"color: rgb(51, 51, 51);\">车子初始时油箱是空的，需要在起点城市加油方可起行。</span><br /></p>\n<h2>输入格式</h2>\n<p>第一行包含两个整数N和M。</p><p>第二行包含N个整数，代表N个城市的单位油价，第i个数即为第i个城市的油价Pi。</p><p>接下来M行，每行包括三个整数u,v,d，表示城市u与城市v之间存在道路，且赛车从u到v需要消耗的油量为d。</p><p>接下来一行包含一个整数q，代表问题数量（q&lt;100)</p><p>接下来q行，每行包含三个整数C、S、E，分别表示<span style=\"color: rgb(51, 51, 51);\">赛车</span>油箱容量、起点城市S、终点城市E。</p><p><b>数据范围：</b></p><p><img alt=\"image.png\" src=\"/public/upload/e861511252.png\" width=\"150\" height=\"120.33203125\" /><br /></p>\n<h2>输出格式</h2>\n<p>对于每个问题，输出一个整数，表示所需的最少油钱。</p><p>如果无法从起点城市开到终点城市，则输出”impossible”。</p><p>每个结果占一行。</p>\n<h2>样例</h2>\n<h3>样例输入</h3>\n<pre><code>5 5\n10 10 20 12 13\n0 1 9\n0 2 8\n1 2 1\n1 3 11\n2 3 7\n2\n10 0 3\n20 1 4</code></pre>\n<h3>样例输出</h3>\n<pre><code>170\nimpossible</code></pre>\n<h2>提示</h2>\n<p style=\"margin-left: 0px;\"><a href=\"https://www.bilibili.com/video/BV1sf4y1m7V5\" target=\"_blank\">Andy讲解</a></p><p><a href=\"https://www.acwing.com/problem/content/video/178/\" target=\"_blank\">ACWing讲解</a></p><p>改变自《装满的油箱》</p>"}, {"id": "LinK62", "title": "数字三角形", "thinking": "数字三角形从底部向上递推，每个位置的值加上其正下方和右下方中的较大值，最终顶部f[1][1]就是最大路径和。", "code": "for(int i=n-1;i;i--)\n    for(int j=1;j<=i;j++)\n        f[i][j]+=max(f[i+1][j],f[i+1][j+1]);  // 从下往上取较大的累加\n// 最终f[1][1]即为顶部到底部的最大路径和", "summary": "自底向上递推无需处理边界条件，比自顶向下更简洁。", "fullCode": "#include<iostream>\n#include<cstring>\n#include<algorithm>\nusing namespace std;\nconst int N=510;\nint n;\nint f[N][N];\nint main()\n{\n    cin>>n;\n    for(int i=1;i<=n;i++)\n    {\n        for(int j=1;j<=i;j++)\n        {\n            cin>>f[i][j];\n        }\n    }\n    for(int i=n-1;i;i--)\n    {\n        for(int j=1;j<=i;j++)\n        {\n            f[i][j]+=max(f[i+1][j],f[i+1][j+1]);\n        }\n    }\n    cout<<f[1][1]<<endl;\n    return 0;\n}", "fullProblem": "# LinK62 数字三角形\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p>数字三角形是动态规划的入门题，小鲁如果要入门动态规划，这道题是不可不做的：</p><pre>7<br />3   8<br />8   1   0<br />2   7   4   4<br />4   5   2   6   5<br /><br />(图1)</pre><p><span style=\"color: rgb(35, 31, 23);\">图1给出了一个数字三角形。从三角形的顶部到底部有很多条不同的路径。对于每条路径，把路径上面的数加起来可以得到一个和，你的任务就是找到最大的和。</span></p><p><span style=\"color: rgb(35, 31, 23);\">注意：路径上的每一步只能从一个数走到正下方和右下方的位置。</span></p>\n<h2>输入描述</h2>\n<p><span style=\"color: rgb(35, 31, 23);\">输入的是一行是一个整数N (1 &lt; N &lt;= 1000)，给出三角形的行数。下面的N行给出数字三角形。数字三角形上的数的范围都在0和100之间。</span><br /></p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(35, 31, 23);\">输出最大的和。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>5\n7\n3 8\n8 1 0 \n2 7 4 4\n4 5 2 6 5</code></pre>\n#### 输出\n<pre><code>30</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.bilibili.com/video/av97264332\" target=\"_blank\">什么是动态规划</a></p><p><a href=\"https://www.bilibili.com/video/av97263444\" target=\"_blank\">Andy的讲解</a></p>"}, {"id": "LinK63", "title": "林克的01背包", "thinking": "01背包是背包问题的基础，每个物品最多选一次，转移时比较不选和选两种情况的价值，一维优化时需要倒序遍历容量防止重复选取。", "code": "for(int i=1;i<=n;i++)\n    for(int j=m;j>=v[i];j--)\n        f[j]=max(f[j],f[j-v[i]]+w[i]);  // 一维倒序保证每件物品只选一次\n// 容量大于等于v[i]时才有意义", "summary": "01背包一维优化的关键是容量倒序遍历，这是与完全背包最本质的区别。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=1007;\nint n,m;\nint v[N],w[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>v[i]>>w[i];\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n        {\n            f[i][j]=f[i-1][j];\n            if(j>=v[i])\n                f[i][j]=max(f[i][j],f[i-1][j-v[i]]+w[i]);\n        }\n    cout<<f[n][m]<<endl;\n    return 0;\n}", "fullProblem": "# LinK63 林克的01背包\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p>一眨眼一学期快结束了，早就自学完大四4年计算机专业的小华拿到了任天堂公司的offer提前毕业走上他喜爱的设计之路。</p><p>放心不下还在学校苦苦自学的小鲁，小华送给小鲁一套VR装置和一个新名字——林克。</p><p>他对小鲁说：从此以后，我写的VR编程环境来继续引导你自学编程，但是在这新的虚拟世界中，你要化身为林克，接受各种编程试炼的挑战，你愿意吗？</p><p>小鲁知道随着小华的离开，自己自主学习的新时代来了，他挥泪痛别小华，欣然接过小华的赠与，带上林克头套，进入编程大陆，开始了奇妙的VR编程之旅。</p><p>他还来不及为着小华的离开伤感，第一个挑战就来临了。<br /></p><p>“林克”面临一个艰难的选择,他的背包容量有限,而面前摆放着价值不同的物品(各种套装)</p><p>你可以帮帮他吗?</p><p><img alt=\"image.png\" src=\"/public/upload/4605ef2575.png\" width=\"357\" height=\"201\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/6f6acafda3.png\" width=\"612\" height=\"143\" /><br /></p>\n<h2>输入描述</h2>\n<p><img alt=\"image.png\" src=\"/public/upload/a884a9d2d3.png\" width=\"651\" height=\"72\" /><br /></p><p><img alt=\"image.png\" src=\"/public/upload/a1dc684fed.png\" width=\"192\" height=\"59\" /><br /></p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4 5\n1 2\n2 4\n3 4\n4 5</code></pre>\n#### 输出\n<pre><code>8</code></pre>\n<h3>样例 2</h3>\n#### 输入\n<pre><code>16 24\n30 34\n78 40\n96 97\n2 38\n59 57\n10 48\n28 65\n40 17\n95 84\n17 5\n80 83\n74 32\n37 28\n44 36\n25 14\n95 29</code></pre>\n#### 输出\n<pre><code>86</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.bilibili.com/video/BV197411y7mb\" target=\"_blank\">Andy的讲解</a><br /></p><p><a href=\"https://www.acwing.com/video/944/\" target=\"_blank\">acwing讲解(2020)</a><br /></p>"}, {"id": "LinK64", "title": "林克的完全背包", "thinking": "完全背包每种物品可以无限选取，转移方程中f[i][j]依赖f[i][j-v[i]]（同一层），一维优化时容量正序遍历即可实现重复选取。", "code": "for(int i=1;i<=n;i++)\n    for(int j=v[i];j<=m;j++)\n        f[j]=max(f[j],f[j-v[i]]+w[i]);  // 一维正序允许同物品被多次选取\n// 与01背包仅差一个循环方向的区别", "summary": "完全背包容量正序遍历让同一物品可以重复选取，与01背包仅差这一个循环方向的区别。", "fullCode": "#include<iostream>\nusing namespace std;\nconst int N=1010;\nint f[N][N];\nint v[N],w[N];\nint main()\n{\n    int n,m;\n    cin>>n>>m;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>v[i]>>w[i];\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n        {\n            for(int k=0;k*v[i]<=j;k++)\n                f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+k*w[i]);\n        }\n    cout<<f[n][m]<<endl;\n}", "fullProblem": "# LinK64 林克的完全背包\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p>搞定了01背包问题，林克继续挑战完全背包问题：</p><p><img src=\"https://pic4.zhimg.com/80/v2-6fc1150fbb9af0f4ea680b29f2ebea23_720w.jpg\" /><br /></p><p>有N种物品和一个容量是V的背包，每种物品都有无限件可用。</p><p>第i种物品的体积是vi，价值是wi。</p><p>求解将哪些物品装入背包，可使这些物品的总体积不超过背包容量，且总价值最大。<br />输出最大价值。</p><p><span style=\"color: rgb(227, 55, 55);\">数据范围</span><br /></p><p><span style=\"color: rgb(227, 55, 55);\">0&lt;N,V≤1000<br />0&lt;vi,wi≤1000</span></p>\n<h2>输入描述</h2>\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行两个整数vi,wi，用空格隔开，分别表示第i种物品的体积和价值。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>7 884\n6148 6786\n8500 8620\n6136 6930\n8700 6732\n409 3388\n9925 642\n4324 5208</code></pre>\n#### 输出\n<pre><code>6776</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/video/945/\" target=\"_blank\">acwing讲解</a></p>"}, {"id": "LinK65", "title": "多重背包问题1", "thinking": "数据范围较小时可以直接用三重循环枚举每个物品选0到si个，属于最朴素的暴力解法，理解后便于过渡到更高效的优化版本。", "code": "for(int i=1;i<=n;i++)\n    for(int j=m;j>=0;j--)\n        for(int k=1;k<=s[i];k++)\n            if(j>=k*v[i])\n                f[j]=max(f[j],f[j-k*v[i]]+k*w[i]);  // 枚举选k件该物品", "summary": "朴素三重循环仅适用于s不超过100的小数据范围，数据增大时必须使用二进制或单调队列优化。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N =110;\nint n,m;\nint v[N],w[N],s[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=1;i<=n;i++) cin>>v[i]>>w[i]>>s[i];\n    for(int i=1;i<=n;i++)\n        for(int j=0;j<=m;j++)\n            for(int k=0;k<=s[i];k++)\n                if(j>=v[i]*k) f[i][j]=max(f[i][j],f[i-1][j-k*v[i]]+w[i]*k);\n    cout<<f[n][m]<<endl;\n    return 0;\n}", "fullProblem": "# LinK65 多重背包问题(1)\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/f54a4768cf.png\" width=\"600\" height=\"322.2488038277512\" /><br /></p><p style=\"margin-left: 0px;\">有N种物品和一个容量是V的背包。</p><p>第i种物品最多有si件，每件体积是vi，价值是wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。<br />输出最大价值。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p><span style=\"color: rgb(227, 55, 55);\">0&lt;N,V≤100<br />0&lt;vi,wi,si≤100</span></p>\n<h2>输入描述</h2>\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行三个整数vi,wi,si，用空格隔开，分别表示第i种物品的体积、价值和数量。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4 5\n1 2 3\n2 4 1\n3 4 3\n4 5 2</code></pre>\n#### 输出\n<pre><code>10</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/4/\" target=\"_blank\">原题链接</a><br /></p>"}, {"id": "LinK66", "title": "多重背包问题2", "thinking": "用二进制拆分将每种物品的数量si分解为1+2+4+...+2^k+余数，转化为O(log si)个01背包物品，再跑一遍01背包即可。", "code": "int k=1;\nwhile(k<=s) {\n    v[++cnt]=a*k; w[cnt]=b*k;  // 二进制拆包：1,2,4...份打包\n    s-=k; k*=2;\n}\nif(s>0) v[++cnt]=a*s, w[cnt]=b*s;  // 剩余数量单独成组", "summary": "任何一个整数都可以用二进制拆分唯一表示，这是将多重背包降为01背包的理论基础。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=12010,M=2010;\nint n,m;\nint v[N],w[N];\nint f[M];\nint main()\n{\n    cin>>n>>m;\n    int cnt=0;\n    for (int i = 0; i < n; i++)\n    {\n        int a,b,s;\n        cin>>a>>b>>s;\n        int k=1;\n        while(k<=s)\n        {\n            cnt++;\n            v[cnt]=a*k;\n            w[cnt]=b*k;\n            s-=k;\n            k*=2;\n        }\n        if(s>0)\n        {\n            cnt++;\n            v[cnt]=a*s;\n            w[cnt]=b*s;\n        }\n    }\n    n=cnt;\n    for(int i=1;i<=n;i++)\n        for(int j=m;j>=v[i];j--)\n            f[j]=max(f[j],f[j-v[i]]+w[i]);\n    cout<<f[m]<<endl;\n    return 0;\n}", "fullProblem": "# LinK66 多重背包问题(2)\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/205e8efc71.png\" width=\"600\" height=\"322.2488038277512\" /><br /></p><p style=\"margin-left: 0px;\">有N种物品和一个容量是V的背包。</p><p>第i种物品最多有si件，每件体积是vivi，价值是wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。<br />输出最大价值。</p><p><img alt=\"image.png\" src=\"/public/upload/d98a38438e.png\" width=\"174\" height=\"106\" /><br /></p><h5>提示：</h5><p>本题考查多重背包的二进制优化方法。</p>\n<h2>输入描述</h2>\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有N行，每行三个整数vi,wi,si，用空格隔开，分别表示第i种物品的体积、价值和数量。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4 5\n1 2 3\n2 4 1\n3 4 3\n4 5 2</code></pre>\n#### 输出\n<pre><code>10</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/5/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK67", "title": "分组背包问题", "thinking": "分组背包每组内最多选一个物品，容量倒序遍历确保每组只贡献一件，再遍历组内所有物品取最大价值。", "code": "for(int i=1;i<=n;i++)\n    for(int j=m;j>=0;j--)\n        for(int k=0;k<s[i];k++)\n            if(v[i][k]<=j)\n                f[j]=max(f[j],f[j-v[i][k]]+w[i][k]);  // 组内物品互斥选最优", "summary": "分组背包与多重背包代码相似但语义不同：分组是组内物品互斥选一个，多重是同一物品选多个。", "fullCode": "#include<iostream>\n#include<cstdio>\n#include<algorithm>\nusing namespace std;\nint n,m;\nint v[110][110],w[110][110],f[110],s[110];\nint main()\n{\n    scanf(\"%d%d\",&n,&m);\n    for(int i=1;i<=n;i++)\n    {\n        scanf(\"%d\",&s[i]);\n        for(int j=1;j<=s[i];j++)\n            scanf(\"%d%d\",&v[i][j],&w[i][j]);\n    }\n    for(int i=1;i<=n;i++)\n        for(int j=m;j>=1;j--)\n            for(int k=1;k<=s[i];k++)\n            {\n                if(v[i][k]<=j)\n                f[j]=max(f[j],f[j-v[i][k]]+w[i][k]);\n            }\n    printf(\"%d\",f[m]);\n    return 0;\n}", "fullProblem": "# LinK67 分组背包问题\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/904c138622.png\" width=\"600\" height=\"311.04477611940297\" /><br /></p><p style=\"margin-left: 0px;\">有N组物品和一个容量是V的背包。</p><p>每组物品有若干个，同一组内的物品最多只能选一个。<br />每件物品的体积是vij，价值是wij，其中i是组号，j是组内编号。</p><p>求解将哪些物品装入背包，可使物品总体积不超过背包容量，且总价值最大。</p><p>输出最大价值。</p><p><img alt=\"image.png\" src=\"/public/upload/3d0e1e535d.png\" width=\"156\" height=\"118\" /><br /></p>\n<h2>输入描述</h2>\n<p>第一行有两个整数N，V用空格隔开，分别表示物品组数和背包容量。</p><p>接下来有N组数据：</p><p><img alt=\"image.png\" src=\"/public/upload/5adac9c21a.png\" width=\"487\" height=\"72\" /><br /></p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>3 5\n2\n1 2\n2 4\n1\n3 4\n1\n4 5</code></pre>\n#### 输出\n<pre><code>8</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/9/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/341/\" target=\"_blank\">Y总讲解(基础课)</a></p>"}, {"id": "LinK68", "title": "混合背包问题", "thinking": "混合背包将01背包、完全背包、多重背包统一到一个框架中，按si的类型分别处理：完全背包正序，01背包和拆包后的多重背包倒序。", "code": "if(!s) for(int j=v;j<=m;j++) f[j]=max(f[j],f[j-v]+w);  // 完全背包正序\nelse {\n    if(s==-1) s=1;\n    // 二进制拆包后按01背包倒序统一处理\n}", "summary": "三种背包可以在同一维f数组上统一处理，关键在于根据物品类型选择正确的容量遍历方向。", "fullCode": "#include<iostream>\n#include<cstring>\n#include<algorithm>\nusing namespace std;\nconst int N=1007;\nint n,m;\nint f[N];\nint main()\n{\n    cin>>n>>m;\n    for(int i=0;i<n;i++)\n    {\n        int v,w,s;\n        cin>>v>>w>>s;\n        if(!s)\n        {\n            for(int j=v;j<=m;j++)\n            f[j]=max(f[j],f[j-v]+w);\n        }\n        else\n        {\n            if(s==-1) s=1;\n            for(int k=1;k<=s;k*2)\n            {\n                for(int j=m;j>=k*v;j--)\n                    f[j]=max(f[j],f[j-k*v]+k*w);\n                    s-=k;\n            }\n            if(s)\n            {\n                for(int j=m;j>=s*v;j--)\n                    f[j]=max(f[j],f[j-s*v]+s*w);\n            }\n        }\n    }\n    cout<<f[m]<<endl;\n    return 0;\n}", "fullProblem": "# LinK68 混合背包问题\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Java, Python3\n<h2>题目描述</h2>\n<p>有 N 种物品和一个容量是 V 的背包。</p><p>物品一共有三类：</p><p>第一类物品只能用1次（01背包）；</p><p>第二类物品可以用无限次（完全背包）；</p><p>第三类物品最多只能用 si 次（多重背包）；</p><p>每种体积是 vi，价值是 wi。</p><p>求解将哪些物品装入背包，可使物品体积总和不超过背包容量，且价值总和最大。</p><p>输出最大价值。</p>\n<h2>输入描述</h2>\n<p>第一行两个整数，N，V，用空格隔开，分别表示物品种数和背包容积。</p><p>接下来有 N 行，每行三个整数 vi,wi,si，用空格隔开，分别表示第 i 种物品的体积、价值和数量。</p><p>si=−1 表示第 i 种物品只能用1次；</p><p>si=0 表示第 i 种物品可以用无限次；</p><p>si&gt;0 表示第 i 种物品可以使用 si 次；</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大价值。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4 5\n1 2 -1\n2 4 1\n3 4 0\n4 5 2</code></pre>\n#### 输出\n<pre><code>8</code></pre>"}, {"id": "LinK69", "title": "摘花生", "thinking": "二维网格DP中每个格子只能从上方或左方到达，当前格子的花生数加上两个方向中的较大值即为到该格的最大累计值。", "code": "for(int i=1;i<=n;i++)\n    for(int j=1;j<=m;j++)\n        f[i][j]=max(f[i-1][j],f[i][j-1])+w[i][j];  // 从上方或左方转移\n// 边界格子的上或左方为0，自动正确处理", "summary": "网格DP是最基础的二维DP模型，边界默认初始化为0即可正确处理。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=110;\nint n,m;\nint w[N][N];\nint f[N][N];\nint main()\n{\n    int T;\n    scanf(\"%d\",&T);\n    while(T--)\n    {\n        scanf(\"%d%d\",&n,&m);\n        for(int i=1;i<=n;i++)\n            for(int j=1;j<=m;j++)\n                scanf(\"%d\",&w[i][j]);\n        for(int i=1;i<=n;i++)\n            for(int j=1;j<=m;j++)\n                f[i][j]=max(f[i-1][j],f[i][j-1])+w[i][j];\n        printf(\"%d\\n\",f[n][m]);\n\n    }\n    return 0;\n}", "fullProblem": "# LinK69 摘花生\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Java, Python3\n<h2>题目描述</h2>\n<p>她来到一片有网格状道路的矩形花生地，从西北角进去，东南角出来。</p><p>地里每个道路的交叉点上都有种着一株花生苗，上面有若干颗花生，经过一株花生苗就能摘走该它上面所有的花生。</p><p>Hello Kitty只能向东或向南走，不能向西或向北走。</p><p>问Hello Kitty最多能够摘到多少颗花生。</p><p><br /></p><p><img src=\"https://cdn.acwing.com/media/article/image/2019/09/12/19_a8509f26d5-1.gif\" alt=\"1.gif\" /><br /></p>\n<h2>输入描述</h2>\n<p>第一行是一个整数<code>T</code>，代表一共有多少组数据。</p><p>接下来是<code>T</code>组数据。</p><p>每组数据的第一行是两个整数，分别代表花生苗的行数<code>R</code>和列数<code>C</code>。</p><p>每组数据的接下来<code>R</code>行数据，从北向南依次描述每行花生苗的情况。每行数据有<code>C</code>个整数，按从西向东的顺序描述了该行每株花生苗上的花生数目<code>M</code>。</p><p><strong>数据范围</strong></p><p>1 ≤<code>T</code>≤ 100</p><p>1 ≤<code>R</code>，<code>C</code>≤ 100</p><p>0 ≤<code>M</code>≤ 1000</p>\n<h2>输出描述</h2>\n<p>对每组输入数据，输出一行，内容为Hello Kitty能摘到得最多的花生颗数。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>2\n2 2\n1 1\n3 4\n2 3\n2 3 4\n1 6 5</code></pre>\n#### 输出\n<pre><code>8\n16</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/1017/\" target=\"_blank\">原题链接</a></p><p><a href=\"http://www.example.comhttps://www.acwing.com/video/2332/\" target=\"_blank\">Y总讲解</a></p><p><a href=\"https://www.acwing.com/activity/content/code/content/112796/\" target=\"_blank\">Y总代码</a></p>"}, {"id": "LinK70", "title": "最低通行费", "thinking": "该问题在网格最短路径的基础上增加2N-1步数限制，等价于只能向右或向下移动，用二维DP从左上角递推到右下角即可求解。", "code": "for(int i=1;i<=n;i++)\n    for(int j=1;j<=n;j++) {\n        f[i][j]=INF;\n        // 2N-1等价于不走回头路，只从上方或左方转移\n        if(i>1) f[i][j]=min(f[i][j],f[i-1][j]+w[i][j]);\n        if(j>1) f[i][j]=min(f[i][j],f[i][j-1]+w[i][j]);\n    }", "summary": "2N-1的限制等价于只向右下移动，识别出这个等价关系是解题的关键一步。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=110,INF=1e9;\nint n;\nint w[N][N];\nint f[N][N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=1;i<=n;i++)\n        for(int j=1;j<=n;j++)\n            scanf(\"%d\",&w[i][j]);\n    for(int i=1;i<=n;i++)\n        for(int j=1;j<=n;j++)\n            if(i==1&&j==1) f[i][j]=w[i][j];\n            else\n            {\n                f[i][j]=INF;\n                if(i>1) f[i][j]=min(f[i][j],f[i-1][j]+w[i][j]);\n                if(j>1) f[i][j]=min(f[i][j],f[i][j-1]+w[i][j]);\n            }\n    printf(\"%d\\n\",f[n][n]);\n    return 0;\n}", "fullProblem": "# LinK70 最低通行费\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p>一个商人穿过一个N×N的正方形的网格，去参加一个非常重要的商务活动。</p><p>他要从网格的左上角进，右下角出。</p><p>每穿越中间1个小方格，都要花费1个单位时间。</p><p>商人必须在(2N - 1)个单位时间穿越出去。</p><p>而在经过中间的每个小方格时，都需要缴纳一定的费用。</p><p>这个商人期望在规定时间内用最少费用穿越出去。</p><p>请问至少需要多少费用？</p><p>注意：不能对角穿越各个小方格（即，只能向上下左右四个方向移动且不能离开网格）。</p>\n<h2>输入描述</h2>\n<p>第一行是一个整数，表示正方形的宽度N。</p><p>后面N行，每行N个不大于100的正整数，为网格上每个小方格的费用。</p><p><strong>数据范围</strong></p><p>1 ≤ N ≤ 100</p>\n<h2>输出描述</h2>\n<p>输出一个整数，表示至少需要的费用。</p><p><strong>样例解释</strong></p><p>样例中，最小值为109 = 1 + 2 + 5 + 7 + 9 + 12 + 19 + 21 + 33。</p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>5\n1  4  6  8  10\n2  5  7  15 17\n6  8  9  18 20\n10 11 12 19 21\n20 23 25 29 33</code></pre>\n#### 输出\n<pre><code>109</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/1020/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/solution/content/51101/\" target=\"_blank\">参考题解</a></p><p><a href=\"https://www.acwing.com/activity/content/code/content/112797/\" target=\"_blank\">Y总代码</a></p><p><a href=\"https://www.acwing.com/video/353/\" target=\"_blank\">Y总讲解</a></p>"}, {"id": "LinK71", "title": "最长上升子序列", "thinking": "最长上升子序列是线性DP的入门问题，定义f[i]为以第i个元素结尾的LIS长度，对每个i遍历前面所有比它小的j进行转移。", "code": "for(int i=1;i<=n;i++) {\n    f[i]=1;\n    for(int j=1;j<i;j++)\n        if(a[j]<a[i])\n            f[i]=max(f[i],f[j]+1);  // a[i]可以接在a[j]后面形成更长的序列\n}", "summary": "f[i]初始化为1（自身单独成序列）是容易遗漏的细节，这个初始化错误会导致所有结果偏小。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=1010;\nint n;\nint a[N],f[N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=1;i<=n;i++)\n        scanf(\"%d\",&a[i]);\n    for(int i=1;i<=n;i++)\n    {\n        f[i]=1;\n        for(int j=1;j<i;j++)\n            if(a[j]<a[i])\n                f[i]=max(f[i],f[j]+1);\n    }\n    int res=0;\n    for(int i=1;i<=n;i++) res=max(res,f[i]);\n    printf(\"%d\\n\",res);\n    return 0;\n}", "fullProblem": "# LinK71 最长上升子序列\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">给定一个长度为N的数列，求数值严格单调递增的子序列的长度最长是多少。</span><br /></p><p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/743ae6c848.png\" width=\"212\" height=\"87\" /><br /></span></p>\n<h2>输入描述</h2>\n<p>第一行包含整数N。</p><p>第二行包含N个整数，表示完整序列。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>7\n3 1 2 1 8 5 6</code></pre>\n#### 输出\n<pre><code>4</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/897/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK72", "title": "最长上升子序列2", "thinking": "当n达到1e5时O(n^2)的DP会超时，改用贪心加二分的优化策略，维护q[len]表示长度为len的上升子序列的最小末尾值。", "code": "int len=0;\nfor(int i=0;i<n;i++) {\n    int l=0, r=len;\n    while(l<r) { int mid=l+r+1>>1; if(q[mid]<a[i]) l=mid; else r=mid-1; }\n    // q[r+1]记录长度为r+1的上升子序列的最小可能末尾\n    len=max(len, r+1), q[r+1]=a[i];\n}", "summary": "q数组维护的是各长度的最小末尾而非具体序列本身，理解了存储语义才能正确应用二分边界。", "fullCode": "#include<iostream>\n#include<algorithm>\nusing namespace std;\nconst int N=100010;\nint n;\nint a[N];\nint q[N];\nint main()\n{\n    scanf(\"%d\",&n);\n    for(int i=0;i<n;i++) scanf(\"%d\",&a[i]);\n    int len=0;\n    for(int i=0;i<n;i++)\n    {\n        int l=0,r=len;\n        while(l<r)\n        {\n            int mid=l+r+1>>1;\n            if(q[mid]<a[i]) l=mid;\n            else r=mid-1;\n        }\n        len=max(len,r+1);\n        q[r+1]=a[i];\n    }\n    printf(\"%d\\n\",len);\n    return 0;\n}", "fullProblem": "# LinK72 最长上升子序列(2)\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p>给定一个长度为N的数列，求数值严格单调递增的子序列的长度最长是多少。<br /></p><p><span style=\"color: rgb(51, 51, 51);\"><img alt=\"image.png\" src=\"/public/upload/77823fbbb0.png\" width=\"209\" height=\"85\" /></span><br /></p>\n<h2>输入描述</h2>\n<p>第一行包含整数N。</p><p>第二行包含N个整数，表示完整序列。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>7\n3 1 2 1 8 5 6</code></pre>\n#### 输出\n<pre><code>4</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/898/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK73", "title": "拦截导弹", "thinking": "该问题包含两个子问题：求最长不上升子序列长度用经典DP，求最少拦截系统数等价于最长上升子序列长度（由Dilworth定理保证）。", "code": "for(int i=0;i<n;i++) {\n    f[i]=1;\n    for(int j=0;j<i;j++)\n        if(h[i]<=h[j]) f[i]=max(f[i], f[j]+1);  // 不上升，允许相等\n    res=max(res, f[i]);\n}", "summary": "Dilworth定理表明最少不上升子序列覆盖数等于最长上升子序列长度，这个转换在组合优化中经常用到。", "fullCode": "#include<iostream>\n#include<sstream>\n#include<algorithm>\nusing namespace std;\nconst int N=1010;\nint n;\nint h[N],f[N],q[N];\nint main()\n{\n    string line;\n    getline(cin,line);\n    stringstream ssin(line);\n    while(ssin>>h[n]) n++;\n    int res=0,cnt=0;\n    for(int i=0;i<n;i++)\n    {\n        f[i]=1;\n        for(int j=0;j<i;j++)\n            if(h[i]<=h[j])\n                f[i]=max(f[i],f[j]+1);\n        res=max(res,f[i]);\n        int k=0;\n        while(k<cnt&&q[k]<h[i]) k++;\n        if(k==cnt) q[cnt++]=h[i];\n        else q[k]=h[i];\n    }\n    printf(\"%d\\n\",res);\n    printf(\"%d\\n\",cnt);\n    return 0;\n}", "fullProblem": "# LinK73 拦截导弹\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<p><font>某国为了防御敌国的导弹袭击，发展出一种导弹</font><font>拦截系统。</font></p><p><font>但是这种导弹拦截系统有一个缺陷：虽然它的第一发炮弹能够到达任意的高度，但是以后每一发炮弹都不能高于前一发的高度。</font></p><p><font>某天，雷达捕捉到敌国的</font><font>导弹来袭。由于该系统还在试用阶段，所以只有一套系统，因此有可能不能拦截所有的导弹。</font><br /><br /><font>输入导弹依次飞来的高度（雷达给出的高度数据是不大于</font>30000的正整数），计算这套系统最多能拦截多少导弹，如果要拦截所有导弹最少要配备多少套这种导弹拦截系统。<br /></p>\n<h2>输入描述</h2>\n<p><font>一行，为导弹依次飞来的高度</font><br /></p>\n<h2>输出描述</h2>\n<p><font>两行，分别是最多能拦截的导弹数与要拦截所有导弹最少要配备的系统数</font><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>389 207 155 300 299 170 158 65</code></pre>\n#### 输出\n<pre><code>6\n2</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/1012/\" target=\"_blank\">原题链接</a></p>"}, {"id": "LinK75", "title": "最长公共子序列", "thinking": "最长公共子序列用二维DP求解，f[i][j]表示A的前i个和B的前j个的LCS长度，字符匹配时加1，不匹配时继承两侧的最大值。", "code": "for(int i=1;i<=n;i++)\n    for(int j=1;j<=m;j++)\n        if(a[i]==b[j])\n            f[i][j]=f[i-1][j-1]+1;  // 字符匹配，两个指针同时前进\n        else f[i][j]=max(f[i-1][j], f[i][j-1]);", "summary": "LCS的状态转移只有两个分支，这种简洁的划分方式是很多子序列DP问题的原型。", "fullCode": "#include<iostream>\nusing namespace std;\nconst int N=1010;\nint n,m;\nchar a[N],b[N];\nint f[N][N];\nint main()\n{\n    cin>>n>>m>>a+1>>b+1;\n    for(int i=1;i<=n;i++)\n    {\n        for(int j=1;j<=m;j++)\n        {\n            if(a[i]==b[j])\n            {\n                f[i][j]=f[i-1][j-1]+1;\n            }\n            else\n            {\n                f[i][j]=max(f[i-1][j],f[i][j-1]);\n            }\n        }\n    }\n    cout<<f[n][m]<<'\\n';\n    return 0;\n}", "fullProblem": "# LinK75 最长公共子序列\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\n<h4><span style=\"color: rgb(51, 51, 51);\">给定两个长度分别为N和M的字符串A和B，求既是A的子序列又是B的子序列的字符串长度最长是多少。</span><br /></h4><h4 style=\"margin-left: 0px;\">数据范围</h4><p>1≤N,M≤1000</p>\n<h2>输入描述</h2>\n<p>第一行包含两个整数N和M。</p><p>第二行包含一个长度为N的字符串，表示字符串A。</p><p>第三行包含一个长度为M的字符串，表示字符串B。</p><p>字符串均由小写字母构成。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最大长度。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4 5\nacbd\nabedc</code></pre>\n#### 输出\n<pre><code>3</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/899/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/946/\" target=\"_blank\">Y总讲解</a></p>"}, {"id": "LinK76", "title": "石子合并", "thinking": "石子合并是区间DP的经典模型，f[i][j]表示合并第i到第j堆的最小代价，通过枚举分割点将大区间拆分为两个小区间递归求解。", "code": "for(int len=2;len<=n;len++)\n    for(int i=1;i+len-1<=n;i++) {\n        int j=i+len-1;\n        for(int k=i;k<j;k++)\n            // 左右两堆分别合并，加上区间石子总数\n            f[i][j]=min(f[i][j], f[i][k]+f[k+1][j]+s[j]-s[i-1]);\n    }", "summary": "区间DP必须按长度从小到大枚举，确保计算大区间时小区间已经求解完毕。", "fullCode": "#include<iostream>\n#include<cstring>\nusing namespace std;\nconst int N=307;\nint a[N],s[N];\nint f[N][N];\nint main()\n{\n    int n;\n    cin>>n;\n    for(int i=1;i<=n;i++)\n    {\n        cin>>a[i];\n        s[i]+=s[i-1]+a[i];\n    }\n    memset(f,0x3f,sizeof f);\n    for (int len = 0; len <=n; len++)\n    {\n        for (int i = 1; i +len-1<=n;i++)\n        {\n            int j=i+len-1;\n            if(len==1)\n            {\n                f[i][j]=0;\n                continue;\n            }\n            for(int k=i;k<=j-1;k++)\n            {\n                f[i][j]=min(f[i][j],f[i][k]+f[k+1][j]+s[j]-s[i-1]);\n            }\n        }\n\n    }\n    cout<<f[1][n]<<endl;\n    return 0;\n}", "fullProblem": "# LinK76 石子合并\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Mid\n- 语言：C++\n<h2>题目描述</h2>\n<p style=\"margin-left: 0px;\"><img alt=\"image.png\" src=\"/public/upload/d47e1d10c6.png\" width=\"600\" height=\"336.8560105680317\" /><br /></p><p style=\"margin-left: 0px;\">设有N堆石子排成一排，其编号为1，2，3，…，N。</p><p>每堆石子有一定的质量，可以用一个整数来描述，现在要将这N堆石子合并成为一堆。</p><p>每次只能合并相邻的两堆，合并的代价为这两堆石子的质量之和，合并后与这两堆石子相邻的石子将和新堆相邻，合并时由于选择的顺序不同，合并的总代价也不相同。</p><p>例如有4堆石子分别为 1 3 5 2， 我们可以先合并1、2堆，代价为4，得到4 5 2， 又合并 1，2堆，代价为9，得到9 2 ，再合并得到11，总代价为4+9+11=24；</p><p>如果第二步是先合并2，3堆，则代价为7，得到4 7，最后一次合并代价为11，总代价为4+7+11=22。</p><p>问题是：找出一种合理的方法，使总的代价最小，输出最小代价。</p><h4><span style=\"color: rgb(227, 55, 55);\">数据范围</span></h4><p><span style=\"color: rgb(227, 55, 55);\">1≤N≤300</span></p>\n<h2>输入描述</h2>\n<p>第一行一个数N表示石子的堆数N。</p><p>第二行N个数，表示每堆石子的质量(均不超过1000)。</p>\n<h2>输出描述</h2>\n<p><span style=\"color: rgb(51, 51, 51);\">输出一个整数，表示最小代价。</span><br /></p>\n<h2>样例</h2>\n<h3>样例 1</h3>\n#### 输入\n<pre><code>4\n1 3 5 2</code></pre>\n#### 输出\n<pre><code>22</code></pre>\n<h2>提示</h2>\n<p><a href=\"https://www.acwing.com/problem/content/284/\" target=\"_blank\">原题链接</a></p><p><a href=\"https://www.acwing.com/video/943/\" target=\"_blank\">ACWing讲解</a></p>"}, {"id": "LinK78", "title": "加分二叉树", "thinking": "给定中序遍历构造加分最大的二叉树，用区间DP枚举每段子树的根节点，左右子树加分相乘再加根权值即为整棵树的加分。", "code": "for(int k=l;k<=r;k++) {\n    int left=(k==l?1:f[l][k-1]);  // 左子树为空时加分定义为1\n    int right=(k==r?1:f[k+1][r]);\n    int score=left*right+w[k];\n    if(score>f[l][r]) f[l][r]=score, root[l][r]=k;\n}", "summary": "空子树加分定义为1而非0是本题的关键边界，同时记录root数组可以递归构造出前序遍历序列。", "fullCode": "#include<iostream>\n#include<cstring>\n#include<cstdio>\n#include<algorithm>\nusing namespace std;\n\ntypedef pair<int,int> PII;\nconst int N=50;\nint n;\nint w[N];\nunsigned f[N][N];\nint root[N][N];\n\nvoid dfs(int l,int r)\n{\n    if(l>r) return;\n    int k=root[l][r];\n    printf(\"%d \",k);\n    dfs(l,k-1);\n    dfs(k+1,r);\n}\n\nint main()\n{\n    scanf(\"%d\",&n);\n    for (int i = 1; i <= n; i++)\n    {\n        scanf(\"%d\",&w[i]);\n    }\n\n    for(int len=1;len<=n;len++)\n        for(int l=1;l+len-1<=n;l++)\n        {\n            int r=l+len-1;\n            for(int k=l;k<=r;k++)\n            {\n                int left=k==l?1:f[l][k-1];\n                int right=k==r?1:f[k+1][r];\n                int score=left*right+w[k];\n                if(l==r) score=w[k];\n\n                if(f[l][r]<score)\n                {\n                    f[l][r]=score;\n                    root[l][r]=k;\n                }\n            }\n        }\n    printf(\"%d\\n\",f[1][n]);\n    dfs(1,n);\n    puts(\"\");\n    return 0;\n}", "fullProblem": "# LinK78 加分二叉树\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：Low\n- 语言：C, C++, Java, Python3\n<h2>题目描述</h2>\n<h2>输入描述</h2>\n<h2>输出描述</h2>"}, {"id": "LinK80", "title": "没有上司的舞会", "thinking": "树形DP的入门问题，定义f[u][0]和f[u][1]分别表示不选和选节点u时子树的最大快乐值，通过后序遍历自底向上合并子树的决策结果。", "code": "void dfs(int u) {\n    f[u][1]=happy[u];\n    for(int v:g[u]) { dfs(v);\n        f[u][0]+=max(f[v][0], f[v][1]);  // u不去，下属可以去也可以不去\n        f[u][1]+=f[v][0];\n    }\n}", "summary": "树形DP的通用模式是后序遍历先处理子树再合并到父节点，用0/1表示选不选的状态是这类问题的标准定义方式。", "fullCode": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nconst int N = 6010;\nint n, happy[N];\nvector<int> g[N];\nint f[N][2];\nbool has_father[N];\n\nvoid dfs(int u)\n{\n    f[u][1] = happy[u];\n    for (int v : g[u])\n    {\n        dfs(v);\n        f[u][0] += max(f[v][0], f[v][1]);\n        f[u][1] += f[v][0];\n    }\n}\n\nint main()\n{\n    cin >> n;\n    for (int i = 1; i <= n; i++)\n        cin >> happy[i];\n    for (int i = 0; i < n - 1; i++)\n    {\n        int l, k;\n        cin >> l >> k;\n        g[k].push_back(l);\n        has_father[l] = true;\n    }\n    int root = 1;\n    while (has_father[root])\n        root++;\n    dfs(root);\n    cout << max(f[root][0], f[root][1]) << endl;\n    return 0;\n}", "fullProblem": "# LinK80 没有上司的舞会\n- 比赛：2026年程序设计实践例题(05李胜睿班)\n- 题型：OI\n- 难度：High\n- 语言：C, C++, Python3\n<h2>题目描述</h2>\nUral大学有N名职员，编号为1~N。\n他们的关系就像一棵以校长为根的树，父节点就是子节点的直接上司。\n每个职员有一个快乐指数，用整数Hi给出，其中1≤i≤N。\n现在要召开一场周年庆宴会，不过，没有职员愿意和直接上司一起参会。\n在满足这个条件的前提下，主办方希望邀请一部分职员参会，使得所有参会职员的快乐指数总和最大，求这个最大值。\n数据范围\n1≤N≤6000,\n−128≤Hi≤127\n<h2>输入格式</h2>\n第一行一个整数N。\n接下来N行，第 i 行表示 i 号职员的快乐指数Hi。\n接下来N-1行，每行输入一对整数L, K,表示K是L的直接上司。\n<h2>输出格式</h2>\n输出最大的快乐指数。\n<h2>样例</h2>\n<h3>样例输入</h3>\n<pre><code>7\n1\n1\n1\n1\n1\n1\n1\n1 3\n2 3\n6 4\n7 4\n4 5\n3 5</code></pre>\n<h3>样例输出</h3>\n<pre><code>5</code></pre>\n<h2>提示</h2>\n[acwing讲解](https://www.acwing.com/video/471/)\n[原题链接](https://www.acwing.com/problem/content/287/)"}];function esc(s){if(!s)return"";var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
